<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>QUASAR</title>


    <!-- =========================================
         TAILWIND
    ========================================== -->

    <script src="https://cdn.tailwindcss.com"></script>


    <!-- =========================================
         FRAMER MOTION
         Loaded for animation support.
    ========================================== -->

    <script src="https://unpkg.com/framer-motion@11.18.2/dist/framer-motion.js"></script>


    <!-- =========================================
         STYLES
    ========================================== -->

    <style>

        /* =====================================
           RESET
        ====================================== */

        *{
            box-sizing:border-box;
            margin:0;
            padding:0;
        }


        html,
        body{
            width:100%;
            min-height:100%;
            background:#050507;
        }


        body{

            overflow:hidden;

            color:#fff;

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            -webkit-tap-highlight-color:transparent;

            overscroll-behavior:none;

        }


        button,
        input{
            font:inherit;
        }


        button{
            -webkit-user-select:none;
            user-select:none;
        }


        /* =====================================
           APP
        ====================================== */

        .app{

            width:100%;

            min-height:100vh;

            min-height:100svh;

            display:flex;

            flex-direction:column;

            position:relative;

            overflow:hidden;

            background:#050507;

        }


        /* =====================================
           HEADER
        ====================================== */

        .top{

            width:100%;

            height:68px;

            flex-shrink:0;

            display:flex;

            align-items:center;

            padding:
                0 26px;

            position:relative;

            z-index:100;

        }


        .title{

            font-size:15px;

            font-weight:600;

            letter-spacing:.38em;

            text-indent:.38em;

            color:#fff;

        }


        /* =====================================
           MAIN COSMIC VOID
        ====================================== */

        .main{

            position:relative;

            flex:1;

            min-height:0;

            width:100%;

            overflow:hidden;

        }


        /* =====================================
           SUBTLE AMBIENT LIGHT
        ====================================== */

        .ambient-glow{

            position:absolute;

            width:520px;

            height:520px;

            left:50%;

            top:27%;

            transform:
                translate(-50%,-50%);

            border-radius:50%;

            background:

                radial-gradient(
                    circle,
                    rgba(105,70,220,.07),
                    rgba(70,40,150,.025) 38%,
                    transparent 72%
                );

            filter:blur(28px);

            pointer-events:none;

        }


        /* =====================================
           QUASAR CONTAINER
        ====================================== */

        .quasar{

            position:absolute;

            left:50%;

            top:4px;

            transform:
                translateX(-50%);

            width:190px;

            height:190px;

            z-index:30;

            display:flex;

            align-items:center;

            justify-content:center;

            pointer-events:none;

        }


        /* =====================================
           FLOAT
        ====================================== */

        .quasar-core{

            position:relative;

            width:190px;

            height:190px;

            animation:
                quasarFloat
                5s
                ease-in-out
                infinite;

        }


        /* =====================================
           QUASAR GLOW
        ====================================== */

        .quasar-glow{

            position:absolute;

            width:185px;

            height:185px;

            left:50%;

            top:50%;

            transform:
                translate(-50%,-50%);

            border-radius:50%;

            background:

                radial-gradient(
                    circle,
                    rgba(125,85,255,.18),
                    rgba(85,45,180,.07) 38%,
                    transparent 72%
                );

            filter:blur(13px);

        }


        /* =====================================
           ACCRETION DISK
        ====================================== */

        .disk{

            position:absolute;

            width:174px;

            height:56px;

            left:50%;

            top:50%;

            margin-left:-87px;

            margin-top:-28px;

            border-radius:50%;

            transform:
                rotate(-12deg);

            background:

                radial-gradient(
                    ellipse,

                    rgba(255,255,255,.96) 0%,

                    rgba(255,190,100,.95) 12%,

                    rgba(173,82,255,.92) 34%,

                    rgba(83,50,255,.58) 56%,

                    transparent 73%
                );

            filter:blur(.4px);

            z-index:5;

        }


        .disk-back{

            transform:
                rotate(-12deg)
                translateY(-4px)
                scale(.96);

            opacity:.78;

        }


        .disk-front{

            transform:
                rotate(-12deg)
                translateY(4px);

            opacity:.96;

            animation:
                diskPulse
                3.2s
                ease-in-out
                infinite;

        }


        /* =====================================
           BLACK HOLE
        ====================================== */

        .black-hole{

            position:absolute;

            width:78px;

            height:78px;

            left:50%;

            top:50%;

            margin-left:-39px;

            margin-top:-39px;

            border-radius:50%;

            background:

                radial-gradient(
                    circle,
                    #000 0%,
                    #000 57%,
                    rgba(0,0,0,.98) 69%,
                    transparent 75%
                );

            z-index:10;

            box-shadow:

                0 0 26px
                rgba(0,0,0,.95),

                0 0 52px
                rgba(110,65,255,.17);

            pointer-events:auto;

            cursor:pointer;

            touch-action:none;

        }


        .event-horizon{

            position:absolute;

            inset:7px;

            border-radius:50%;

            background:#000;

        }


        /* =====================================
           ENERGY RING
        ====================================== */

        .energy-ring{

            position:absolute;

            width:130px;

            height:130px;

            left:50%;

            top:50%;

            margin-left:-65px;

            margin-top:-65px;

            border-radius:50%;

            border:
                2px solid
                rgba(170,110,255,.62);

            box-shadow:

                0 0 12px
                rgba(139,92,246,.5),

                0 0 36px
                rgba(139,92,246,.22),

                inset 0 0 15px
                rgba(139,92,246,.2);

            z-index:9;

        }


        /* =====================================
           VERTICAL BEAMS
        ====================================== */

        .beam{

            position:absolute;

            width:11px;

            left:50%;

            margin-left:-5.5px;

            border-radius:50%;

            pointer-events:none;

            z-index:2;

            background:

                linear-gradient(
                    to top,
                    rgba(200,170,255,.94),
                    rgba(105,70,255,.52),
                    transparent
                );

            filter:blur(2px);

            opacity:.72;

        }


        .beam-top{

            height:155px;

            bottom:calc(50% + 35px);

        }


        .beam-bottom{

            height:155px;

            top:calc(50% + 35px);

            transform:rotate(180deg);

        }


        /* =====================================
           NORMAL FLOAT ANIMATION
        ====================================== */

        @keyframes quasarFloat{

            0%,
            100%{
                transform:translateY(0);
            }

            50%{
                transform:translateY(-7px);
            }

        }


        @keyframes diskPulse{

            0%,
            100%{

                transform:
                    rotate(-12deg)
                    translateY(4px)
                    scale(1);

            }

            50%{

                transform:
                    rotate(-12deg)
                    translateY(4px)
                    scale(1.04);

            }

        }


        @keyframes ringPulse{

            0%,
            100%{

                transform:scale(.98);

                opacity:.72;

            }

            50%{

                transform:scale(1.04);

                opacity:1;

            }

        }


        /* =====================================
           THINKING BEAM
        ====================================== */

        .thinking .beam{

            animation:
                beamThinking
                .38s
                ease-in-out
                infinite alternate;

        }


        .thinking .quasar-glow{

            animation:
                thinkingGlow
                .55s
                ease-in-out
                infinite alternate;

        }


        .thinking .energy-ring{

            animation:
                thinkingRing
                .55s
                ease-in-out
                infinite alternate;

        }


        @keyframes beamThinking{

            0%{

                opacity:.45;

                transform:
                    scaleX(.72);

            }

            35%{

                opacity:1;

                transform:
                    scaleX(1.2);

            }

            70%{

                opacity:.55;

                transform:
                    scaleX(.82);

            }

            100%{

                opacity:1;

                transform:
                    scaleX(1.1);

            }

        }


        @keyframes thinkingGlow{

            from{

                opacity:.45;

                transform:
                    translate(-50%,-50%)
                    scale(.94);

            }

            to{

                opacity:1;

                transform:
                    translate(-50%,-50%)
                    scale(1.1);

            }

        }


        @keyframes thinkingRing{

            from{

                opacity:.55;

                transform:scale(.96);

            }

            to{

                opacity:1;

                transform:scale(1.09);

            }

        }


        /* =====================================
           MOBILE QUASAR
        ====================================== */

        @media(max-width:600px){

            .top{

                height:62px;

                padding:
                    0 18px;

            }


            .quasar{

                top:0;

            }


            .quasar-core{

                width:160px;

                height:160px;

            }


            .quasar-glow{

                width:158px;

                height:158px;

            }


            .disk{

                width:145px;

                height:50px;

                margin-left:-72.5px;

                margin-top:-25px;

            }


            .black-hole{

                width:68px;

                height:68px;

                margin-left:-34px;

                margin-top:-34px;

            }


            .energy-ring{

                width:110px;

                height:110px;

                margin-left:-55px;

                margin-top:-55px;

            }


            .beam{

                width:10px;

                margin-left:-5px;

            }


            .beam-top{

                height:135px;

                bottom:calc(50% + 30px);

            }


            .beam-bottom{

                height:135px;

                top:calc(50% + 30px);

            }

        }


        /* =====================================
           REDUCED MOTION
        ====================================== */

        @media(prefers-reduced-motion:reduce){

            .quasar-core,
            .disk,
            .beam,
            .quasar-glow,
            .energy-ring{

                animation:none !important;

            }

        }

    </style>
</head>

<body>

<div class="app">

    <header class="top">

        <div class="title">
            QUASAR
        </div>

    </header>


    <main
        class="main"
        id="cosmicVoid"
    >

        <div
            class="ambient-glow"
            aria-hidden="true"
        ></div>


        <!-- =================================
             CONSTELLATION HISTORY
        ================================== -->

        <div
            id="constellationLayer"
            class="
                absolute
                inset-0
                z-[5]
                pointer-events-none
            "
        ></div>


        <!-- =================================
             DRAWING CANVAS
        ================================== -->

        <canvas
            id="drawCanvas"
            class="
                absolute
                inset-0
                w-full
                h-full
                z-[15]
                touch-none
            ></canvas>


        <!-- =================================
             QUASAR
        ================================== -->

        <div class="quasar">

            <div
                id="quasarCore"
                class="quasar-core"
            >

                <div
                    class="quasar-glow"
                ></div>


                <div
                    class="beam beam-top"
                ></div>


                <div
                    class="beam beam-bottom"
                ></div>


                <div
                    class="disk disk-back"
                ></div>


                <div
                    id="blackHole"
                    class="black-hole"
                    aria-label="QUASAR core"
                >

                    <div
                        class="event-horizon"
                    ></div>

                </div>


                <div
                    class="disk disk-front"
                ></div>


                <div
                    class="energy-ring"
                ></div>

            </div>

        </div>
        <!-- =================================
             ORBIT SYSTEM
        ================================== -->

        <div
            id="orbitLayer"
            class="
                absolute
                inset-0
                z-[20]
                pointer-events-none
            "
        ></div>


        <!-- =================================
             THINKING PARTICLES
        ================================== -->

        <div
            id="particleLayer"
            class="
                absolute
                inset-0
                z-[12]
                pointer-events-none
            "
        ></div>


        <!-- =================================
             TEMPORARY SUMMON RESULT
        ================================== -->

        <div
            id="summonResult"
            class="
                absolute
                left-1/2
                top-1/2
                -translate-x-1/2
                -translate-y-1/2
                z-[25]
                pointer-events-none
                opacity-0
                transition-opacity
                duration-500
                text-center
                max-w-xs
                px-6
            "
        >

            <div
                id="summonTitle"
                class="
                    text-[10px]
                    uppercase
                    tracking-[0.35em]
                    text-purple-200/60
                    mb-3
                "
            >
                QUASAR
            </div>


            <div
                id="summonText"
                class="
                    text-sm
                    text-white/80
                    leading-relaxed
                "
            ></div>

        </div>


        <!-- =================================
             COSMIC MODE MANDALA
        ================================== -->

        <div
            id="mandalaLayer"
            class="
                absolute
                left-1/2
                top-[70px]
                -translate-x-1/2
                z-[8]
                pointer-events-none
                opacity-0
                transition-opacity
                duration-700
            "
            aria-hidden="true"
        >

            <svg
                width="420"
                height="420"
                viewBox="0 0 420 420"
                class="w-[420px] h-[420px]"
            >

                <g
                    fill="none"
                    stroke="rgba(166,110,255,.8)"
                    stroke-width="0.7"
                >

                    <!-- Outer circles -->

                    <circle
                        cx="210"
                        cy="210"
                        r="195"
                    />

                    <circle
                        cx="210"
                        cy="210"
                        r="174"
                    />

                    <circle
                        cx="210"
                        cy="210"
                        r="150"
                    />

                    <circle
                        cx="210"
                        cy="210"
                        r="124"
                    />

                    <circle
                        cx="210"
                        cy="210"
                        r="94"
                    />

                    <circle
                        cx="210"
                        cy="210"
                        r="62"
                    />


                    <!-- Radial geometry -->

                    <g
                        transform="translate(210 210)"
                    >

                        <polygon
                            points="
                                0,-172
                                149,86
                                -149,86
                            "
                        />

                        <polygon
                            points="
                                0,172
                                149,-86
                                -149,-86
                            "
                        />


                        <polygon
                            points="
                                0,-132
                                114,66
                                -114,66
                            "
                        />

                        <polygon
                            points="
                                0,132
                                114,-66
                                -114,-66
                            "
                        />


                        <rect
                            x="-88"
                            y="-88"
                            width="176"
                            height="176"
                            transform="rotate(45)"
                        />


                        <rect
                            x="-61"
                            y="-61"
                            width="122"
                            height="122"
                            transform="rotate(45)"
                        />


                        <!-- Radial lines -->

                        <line
                            x1="0"
                            y1="-195"
                            x2="0"
                            y2="195"
                        />

                        <line
                            x1="-195"
                            y1="0"
                            x2="195"
                            y2="0"
                        />

                        <line
                            x1="-138"
                            y1="-138"
                            x2="138"
                            y2="138"
                        />

                        <line
                            x1="138"
                            y1="-138"
                            x2="-138"
                            y2="138"
                        />

                    </g>

                </g>

            </svg>

        </div>


        <!-- =================================
             DRAWING GUIDE
        ================================== -->

        <div
            id="drawGuide"
            class="
                absolute
                left-1/2
                top-[42%]
                -translate-x-1/2
                -translate-y-1/2
                z-[16]
                pointer-events-none
                opacity-0
                transition-opacity
                duration-300
                text-center
            "
        >

            <div
                class="
                    text-[9px]
                    uppercase
                    tracking-[0.3em]
                    text-white/30
                "
            >
                Draw to summon
            </div>

        </div>


        <!-- =================================
             SUGGESTION RESULT
        ================================== -->

        <div
            id="suggestionPanel"
            class="
                absolute
                left-1/2
                top-1/2
                -translate-x-1/2
                -translate-y-1/2
                z-[40]
                w-[min(340px,calc(100%-40px))]
                opacity-0
                pointer-events-none
                transition-all
                duration-300
            "
        >

            <div
                class="
                    rounded-2xl
                    border
                    border-white/[.07]
                    bg-black/70
                    backdrop-blur-xl
                    px-5
                    py-4
                "
            >

                <div
                    class="
                        text-[9px]
                        uppercase
                        tracking-[.3em]
                        text-purple-200/50
                        mb-4
                    "
                >
                    Suggested
                </div>


                <div
                    id="suggestionItems"
                    class="
                        space-y-3
                        text-sm
                        text-white/70
                    "
                ></div>

            </div>

        </div>

    </main>


    <!-- =====================================
         BOTTOM INPUT AREA
    ====================================== -->

    <div
        class="
            input-area
            fixed
            left-0
            right-0
            bottom-6
            z-[100]
            px-4
            pointer-events-none
        "
    >

        <div
            class="
                mx-auto
                w-full
                max-w-3xl
                pointer-events-auto
            "
        >

            <form
                id="chatForm"
                class="
                    relative
                    flex
                    items-center
                    gap-2
                    rounded-full
                    border
                    border-white/[.08]
                    bg-[#111115]/95
                    backdrop-blur-xl
                    px-2
                    py-2
                    shadow-[0_18px_60px_rgba(0,0,0,.55)]
                "
            >

                <!-- INPUT -->

                <input
                    id="chatInput"
                    type="text"
                    autocomplete="off"
                    spellcheck="true"
                    placeholder="Ask QUASAR anything..."
                    class="
                        min-w-0
                        flex-1
                        bg-transparent
                        outline-none
                        border-none
                        px-4
                        py-3
                        text-[14px]
                        text-white
                        placeholder:text-white/30
                    "
                />


                <!-- MIC -->

                <button
                    id="micButton"
                    type="button"
                    aria-label="Voice input"
                    class="
                        flex
                        h-10
                        w-10
                        shrink-0
                        items-center
                        justify-center
                        rounded-full
                        text-white/45
                        transition
                        hover:text-white
                        active:scale-95
                    "
                >

                    <svg
                        width="18"
                        height="18"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.7"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >

                        <rect
                            x="9"
                            y="2"
                            width="6"
                            height="12"
                            rx="3"
                        />

                        <path
                            d="M5 11a7 7 0 0 0 14 0"
                        />

                        <path
                            d="M12 18v4"
                        />

                        <path
                            d="M8 22h8"
                        />

                    </svg>

                </button>


                <!-- SEND -->

                <button
                    id="sendButton"
                    type="submit"
                    aria-label="Send message"
                    class="
                        flex
                        h-10
                        w-10
                        shrink-0
                        items-center
                        justify-center
                        rounded-full
                        bg-white
                        text-black
                        transition
                        hover:bg-white/90
                        active:scale-95
                    "
                >

                    <svg
                        width="17"
                        height="17"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >

                        <path
                            d="M5 12h14"
                        />

                        <path
                            d="m13 6 6 6-6 6"
                        />

                    </svg>

                </button>

            </form>

        </div>

    </div>


    <!-- =====================================
         SVG FILTERS
    ====================================== -->

    <svg
        width="0"
        height="0"
        style="position:absolute"
        aria-hidden="true"
    >

        <defs>

            <filter
                id="gravityWarp"
                x="-30%"
                y="-30%"
                width="160%"
                height="160%"
            >

                <feTurbulence
                    type="fractalNoise"
                    baseFrequency="0.012"
                    numOctaves="2"
                    seed="7"
                    result="noise"
                />

                <feDisplacementMap
                    in="SourceGraphic"
                    in2="noise"
                    scale="3"
                    xChannelSelector="R"
                    yChannelSelector="B"
                />

            </filter>


            <filter
                id="softGlow"
                x="-100%"
                y="-100%"
                width="300%"
                height="300%"
            >

                <feGaussianBlur
                    stdDeviation="4"
                    result="blur"
                />

                <feMerge>

                    <feMergeNode
                        in="blur"
                    />

                    <feMergeNode
                        in="SourceGraphic"
                    />

                </feMerge>

            </filter>

        </defs>

    </svg>


    <!-- =====================================
         APPLICATION SCRIPT
    ====================================== -->

    <script>

        /* =====================================
           GLOBAL STATE
        ====================================== */

        const state = {

            chats: [],

            thinking: false,

            cosmic: false,

            drawing: false,

            voiceActive: false,

            longPressTimer: null,

            orbitId: 0

        };


        /* =====================================
           ELEMENTS
        ====================================== */

        const app =
            document.querySelector(".app");

        const main =
            document.getElementById("cosmicVoid");

        const blackHole =
            document.getElementById("blackHole");

        const quasarCore =
            document.getElementById("quasarCore");

        const chatForm =
            document.getElementById("chatForm");

        const chatInput =
            document.getElementById("chatInput");

        const micButton =
            document.getElementById("micButton");

        const orbitLayer =
            document.getElementById("orbitLayer");

        const particleLayer =
            document.getElementById("particleLayer");

        const constellationLayer =
            document.getElementById("constellationLayer");

        const mandalaLayer =
            document.getElementById("mandalaLayer");

        const drawCanvas =
            document.getElementById("drawCanvas");

        const drawGuide =
            document.getElementById("drawGuide");

        const summonResult =
            document.getElementById("summonResult");

        const summonText =
            document.getElementById("summonText");

        const suggestionPanel =
            document.getElementById("suggestionPanel");

        const suggestionItems =
            document.getElementById("suggestionItems");


        /* =====================================
           CANVAS
        ====================================== */

        const ctx =
            drawCanvas.getContext("2d");


        let drawPoints = [];


        function resizeCanvas(){

            const rect =
                main.getBoundingClientRect();

            const dpr =
                Math.min(
                    window.devicePixelRatio || 1,
                    2
                );

            drawCanvas.width =
                rect.width * dpr;

            drawCanvas.height =
                rect.height * dpr;

            drawCanvas.style.width =
                rect.width + "px";

            drawCanvas.style.height =
                rect.height + "px";

            ctx.setTransform(
                dpr,
                0,
                0,
                dpr,
                0,
                0
            );

        }


        resizeCanvas();

        window.addEventListener(
            "resize",
            resizeCanvas
        );


        /* =====================================
           UTILS
        ====================================== */

        function clamp(
            value,
            min,
            max
        ){

            return Math.max(
                min,
                Math.min(max,value)
            );

        }


        function escapeHTML(value){

            return String(value)
                .replace(/&/g,"&amp;")
                .replace(/</g,"&lt;")
                .replace(/>/g,"&gt;")

            return (
                baseAssistant +
                index * step
            );

        function getCanvasPoint(
            event
        ){

            const rect =
                drawCanvas.getBoundingClientRect();


            return {

                x:
                    event.clientX -
                    rect.left,

                y:
                    event.clientY -
                    rect.top

            };

        function clearDrawing(){

            ctx.clearRect(
                0,
                0,
                drawCanvas.clientWidth,
                drawCanvas.clientHeight
            );

        }


        function drawPath(){

            clearDrawing();


            if(
                points.length < 2
            ){
                return;
            }


            ctx.beginPath();


            ctx.moveTo(
                points[0].x,
                points[0].y
            );


            for(
                let i=1;
                i<points.length;
                i++
            ){

                ctx.lineTo(
                    points[i].x,
                    points[i].y
                );

            }


            ctx.strokeStyle =
                "rgba(190,155,255,.75)";


            ctx.lineWidth =
                2;


            ctx.lineCap =
                "round";


            ctx.lineJoin =
                "round";


            ctx.shadowBlur =
                14;


            ctx.shadowColor =
                "rgba(130,80,255,.75)";


            ctx.stroke();

        }


        function distance(
            a,
            b
        ){

            const dx =
                a.x - b.x;

            const dy =
                a.y - b.y;


            return Math.sqrt(
                dx * dx +
                dy * dy
            );

        }


        /* =====================================
           CIRCLE DETECTION
        ====================================== */

        function looksLikeCircle(){

            if(
                points.length < 18
            ){

                return false;

            }


            const first =
                points[0];


            const last =
                points[
                    points.length - 1
                ];


            const closure =
                distance(
                    first,
                    last
                );


            let minX =
                Infinity;

            let maxX =
                -Infinity;

            let minY =
                Infinity;

            let maxY =
                -Infinity;


            points.forEach(
                point=>{

                    minX =
                        Math.min(
                            minX,
                            point.x
                        );

                    maxX =
                        Math.max(
                            maxX,
                            point.x
                        );

                    minY =
                        Math.min(
                            minY,
                            point.y
                        );

                    maxY =
                        Math.max(
                            maxY,
                            point.y
                        );

                }
            );


            const width =
                maxX - minX;


            const height =
                maxY - minY;


            if(
                width < 45 ||
                height < 45
            ){

                return false;

            }


            const size =
                Math.max(
                    width,
                    height
                );


            /*
             * A reasonably closed path
             * with a roughly circular shape.
             */

            if(
                closure >
                size * .25
            ){

                return false;

            }


            const ratio =
                width / height;


            return (
                ratio > .55 &&
                ratio < 1.8
            );

        }


        /* =====================================
           QUESTION-MARK DETECTION
        ====================================== */

        function looksLikeQuestion(){

            if(
                points.length < 12
            ){

                return false;

            }


            let minX =
                Infinity;

            let maxX =
                -Infinity;

            let minY =
                Infinity;

            let maxY =
                -Infinity;


            points.forEach(
                point=>{

                    minX =
                        Math.min(
                            minX,
                            point.x
                        );

                    maxX =
                        Math.max(
                            maxX,
                            point.x
                        );

                    minY =
                        Math.min(
                            minY,
                            point.y
                        );

                    maxY =
                        Math.max(
                            maxY,
                            point.y
                        );

                }
            );


            const width =
                maxX - minX;


            const height =
                maxY - minY;


            if(
                width < 25 ||
                height < 45
            ){

                return false;

            }


            /*
             * Look for a lower vertical tail.
             */

            const lower =
                points.filter(
                    point =>
                        point.y >
                        minY +
                        height * .68
                );


            if(
                lower.length <
                points.length * .08
            ){

                return false;

            }


            return true;

        }

                    rgba(105,70,220,.07);

            }


            #chatInput::selection{

                background:
                    rgba(150,100,255,.25);

            }


            /* ================================
               DRAW CANVAS
            ================================= */

            #drawCanvas{

                cursor:
                    crosshair;

            }


            /* ================================
               SUGGESTIONS
            ================================= */

            #suggestionPanel{

                transform:
                    translate(-50%,-50%)
                    scale(.96);

            }


            #suggestionPanel[style*="opacity: 1"]{

                transform:
                    translate(-50%,-50%)
                    scale(1);

            }


            /* ================================
               MANDALA
            ================================= */

            #mandalaLayer{

                mix-blend-mode:
                    screen;

            }


            /* ================================
               MOBILE
            ================================= */

            @media(max-width:600px){

                #orbitLayer{

                    perspective:
                        650px;

                }


                .gravity-text{

                    font-size:
                        10px;

                    padding:
                        8px 12px;

                }


                #suggestionPanel{

                    top:
                        45%;

                }


                #mandalaLayer{

                    top:
                        35px;

                }


                #mandalaLayer svg{

                    width:
                        330px;

                    height:
                        330px;

                }

            }


            /* ================================
               REDUCED MOTION
            ================================= */

            @media(prefers-reduced-motion:reduce){

                #mandalaLayer svg{

                    animation:
                        none !important;

                }

                .constellation-star{

                    transition:
                        none !important;

                }

            }

        `;


        document.head.appendChild(
            finalVisualStyle
        );


        /* =====================================
           DRAWING GLOW
        ====================================== */

        function summonGlow(){

            const glow =
                document.createElement(
                    "div"
                );


            glow.className = `
                absolute
                left-1/2
                top-[180px]
                -translate-x-1/2
                w-[100px]
                h-[100px]
                rounded-full
                pointer-events-none
                z-[18]
            `;


            glow.style.background =
                `
                radial-gradient(
                    circle,
                    rgba(170,120,255,.22),
                    transparent 70%
                )
                `;


            glow.style.filter =
                "blur(8px)";


            main.appendChild(
                glow
            );


            glow.animate(
                [

                    {
                        opacity:0,

                        transform:
                            "translateX(-50%) scale(.4)"

                    },

                    {

                        opacity:1,

                        transform:
                            "translateX(-50%) scale(1.15)"

                    },

                    {

                        opacity:0,

                        transform:
                            "translateX(-50%) scale(1.8)"

                    }

                ],
                {

                    duration:850,

                    easing:
                        "cubic-bezier(.2,.8,.2,1)"

                }
            );


            setTimeout(
                ()=>{

                    glow.remove();

                },
                900
            );

        }


        /* =====================================
           REPLACE SUMMON WITH GLOW
        ====================================== */

        const originalSummon =
            summonInput;


        summonInput = function(){

            summonGlow();

            originalSummon();

        };


        /* =====================================
           TOUCH FEEDBACK
        ====================================== */

        function touchPulse(
            x,
            y
        ){

            const pulse =
                document.createElement(
                    "div"
                );


            pulse.className = `
                absolute
                z-[35]
                w-[12px]
                h-[12px]
                rounded-full
                pointer-events-none
            `;


            pulse.style.left =
                x + "px";


            pulse.style.top =
                y + "px";


            pulse.style.marginLeft =
                "-6px";


            pulse.style.marginTop =
                "-6px";


            pulse.style.background =
                "rgba(185,145,255,.75)";


            pulse.style.boxShadow =
                "0 0 20px rgba(150,100,255,.8)";


            main.appendChild(
                pulse
            );


            pulse.animate(
                [

                    {
                        transform:
                            "scale(.4)",

                        opacity:.8

                    },

                    {

                        transform:
                            "scale(4)",

                        opacity:0

                    }

                ],
                {

                    duration:500,

                    easing:
                        "ease-out"

                }
            );


            setTimeout(
                ()=>{

                    pulse.remove();

                },
                520
            );

        }


        /* =====================================
           DRAW COMPLETION FEEDBACK
        ====================================== */

        drawCanvas.addEventListener(
            "pointerup",
            event=>{

                const point =
                    getCanvasPoint(
                        event
                    );


                if(
                    points.length > 5
                ){

                    touchPulse(
                        point.x,
                        point.y
                    );

                }

            }
        );


        /* =====================================
           CONSTELLATION CONNECTIONS
        ====================================== */

        const constellationLines =
            document.createElement(
                "canvas"
            );


        constellationLines.className = `
            absolute
            inset-0
            w-full
            h-full
            pointer-events-none
            z-[4]
        `;


        main.insertBefore(
            constellationLines,
            constellationLayer
        );


        const lineCtx =
            constellationLines.getContext(
                "2d"
            );


        function resizeConstellationCanvas(){

            const rect =
                main.getBoundingClientRect();


            const dpr =
                Math.min(
                    window.devicePixelRatio || 1,
                    2
                );


            constellationLines.width =
                rect.width * dpr;


            constellationLines.height =
                rect.height * dpr;


            constellationLines.style.width =
                rect.width + "px";


            constellationLines.style.height =
                rect.height + "px";


            lineCtx.setTransform(
                dpr,
                0,
                0,
                dpr,
                0,
                0
            );


            drawConstellationLines();

        }


        function drawConstellationLines(){

            const width =
                constellationLines.clientWidth;


            const height =
                constellationLines.clientHeight;


            lineCtx.clearRect(
                0,
                0,
                width,
                height
            );


            /*
             * Very subtle connections between
             * nearby historical stars.
             */

            lineCtx.strokeStyle =
                "rgba(150,120,220,.045)";


            lineCtx.lineWidth =
                .7;


            for(
                let i=0;
                i<starPositions.length;
                i++
            ){

                const a =
                    starPositions[i];


                const ax =
                    width *
                    a[0] /
                    100;


                const ay =
                    height *
                    a[1] /
                    100;


                for(
                    let j=i+1;
                    j<starPositions.length;
                    j++
                ){

                    const b =
                        starPositions[j];


                    const bx =
                        width *
                        b[0] /
                        100;


                    const by =
                        height *
                        b[1] /
                        100;


                    const dx =
                        ax - bx;


                    const dy =
                        ay - by;


                    const distance =
                        Math.sqrt(
                            dx*dx +
                            dy*dy
                        );


                    if(
                        distance < 145
                    ){

                        lineCtx.beginPath();

                        lineCtx.moveTo(
                            ax,
                            ay
                        );

                        lineCtx.lineTo(
                            bx,
                            by
                        );

                        lineCtx.stroke();

                    }

                }

            }

        }


        resizeConstellationCanvas();


        window.addEventListener(
            "resize",
            resizeConstellationCanvas
        );


        /* =====================================
           PERIODIC CONSTELLATION TWINKLE
        ====================================== */

        function twinkleStars(){

            const stars =
                constellationLayer.querySelectorAll(
                    "button"
                );


            stars.forEach(
                (star,index)=>{

                    const delay =
                        (index * 173) % 2600;


                    star.animate(
                        [

                            {
                                opacity:
                                    .28
                            },

                            {
                                opacity:
                                    .65
                            },

                            {
                                opacity:
                                    .32
                            }

                        ],
                        {

                            duration:
                                2400,

                            delay,

                            iterations:
                                Infinity,

                            easing:
                                "ease-in-out"

                        }
                    );

                }
            );

        }


        twinkleStars();


        /* =====================================
           MODE INDICATOR
        ====================================== */

        const modeIndicator =
            document.createElement(
                "div"
            );


        modeIndicator.className = `
            absolute
            left-1/2
            top-[268px]
            -translate-x-1/2
            z-[32]
            pointer-events-none
            text-[8px]
            uppercase
            tracking-[.45em]
            text-white/0
            transition-all
            duration-500
        `;


        modeIndicator.textContent =
            "COSMIC";


        main.appendChild(
            modeIndicator
        );


        function updateModeIndicator(){

            if(state.cosmic){

                modeIndicator.classList.remove(
                    "text-white/0"
                );


                modeIndicator.classList.add(
                    "text-purple-200/35"
                );

            }else{

                modeIndicator.classList.add(
                    "text-white/0"
                );


                modeIndicator.classList.remove(
                    "text-purple-200/35"
                );

            }

        }


        /* =====================================
           WRAP COSMIC MODE
        ====================================== */

        const previousSetCosmicMode =
            setCosmicMode;


        setCosmicMode = function(
            enabled
        ){

            previousSetCosmicMode(
                enabled
            );


            updateModeIndicator();

        };


        /* =====================================
           INITIALIZE MODE
        ====================================== */

        updateModeIndicator();


        /* =====================================
           FOCUS INPUT ON "/" KEY
        ====================================== */

        document.addEventListener(
            "keydown",
            event=>{

                if(
                    event.key === "/" &&
                    document.activeElement !==
                        chatInput
                ){

                    event.preventDefault();

                    chatInput.focus();

                }

            }
        );


        /* =====================================
           ESCAPE
        ====================================== */

        document.addEventListener(
            "keydown",
            event=>{

                if(
                    event.key === "Escape"
                ){

                    hideSuggestions();

                    hideSummon();

                    resetDrawing();

                    chatInput.blur();

                }

            }
        );


        /* =====================================
           CLEAN ORBITS AFTER HISTORY LOAD
        ====================================== */

        function cleanOrbitOverflow(){

            const orbits =
                orbitLayer.children;


            if(
                orbits.length <= 12
            ){

                return;

            }


            while(
                orbitLayer.children.length >
                12
            ){

                orbitLayer.firstElementChild
                    .remove();

            }

        }


        /* =====================================
           ORBIT RENDER WRAPPER
        ====================================== */

        const originalRenderOrbits =
            renderOrbits;


        renderOrbits = function(){

            originalRenderOrbits();

            cleanOrbitOverflow();

            requestAnimationFrame(
                ()=>{
                    gravityPulse();
                    refreshOrbitOrientation();
                }
            );

        };


        /* =====================================
           FINAL INITIAL RENDER
        ====================================== */

        renderOrbits();


        /* =====================================
           INPUT PLACEHOLDER BEHAVIOR
        ====================================== */

        chatInput.addEventListener(
            "focus",
            ()=>{

                chatForm.style.transform =
                    "translateY(-1px)";

            }
        );


        chatInput.addEventListener(
            "blur",
            ()=>{

                chatForm.style.transform =
                    "translateY(0)";

            }
        );


        /* =====================================
           STARTUP
        ====================================== */

        requestAnimationFrame(
            ()=>{

                resizeCanvas();

                resizeConstellationCanvas();

                gravityPulse();

                refreshOrbitOrientation();

            }
        );
        /* =====================================
           FINAL MOBILE ORBIT ADJUSTMENTS
        ====================================== */

        function adjustMobileLayout(){

            const mobile =
                window.innerWidth <= 600;


            const quasar =
                document.querySelector(
                    ".quasar"
                );


            if(mobile){

                quasar.style.top =
                    "-4px";

            }else{

                quasar.style.top =
                    "4px";

            }

        }


        adjustMobileLayout();


        window.addEventListener(
            "resize",
            adjustMobileLayout
        );


        /* =====================================
           PREVENT ACCIDENTAL PAGE SCROLL
        ====================================== */

        document.addEventListener(
            "touchmove",
            event=>{

                /*
                 * Allow scrolling/interaction inside
                 * normal form controls, but keep the
                 * cosmic canvas stable.
                 */

                if(
                    event.target === drawCanvas
                ){

                    event.preventDefault();

                }

            },
            {
                passive:false
            }
        );


        /* =====================================
           FINAL DRAW CLEANUP
        ====================================== */

        window.addEventListener(
            "blur",
            ()=>{

                if(drawing){

                    drawing =
                        false;

                    points = [];

                    clearDrawing();

                }


                cancelLongPress();

            }
        );


        /* =====================================
           FINAL PERFORMANCE CLEANUP
        ====================================== */

        let animationFrame = null;


        function lightweightRefresh(){

            if(
                animationFrame
            ){

                cancelAnimationFrame(
                    animationFrame
                );

            }


            animationFrame =
                requestAnimationFrame(
                    ()=>{

                        resizeCanvas();

                        resizeConstellationCanvas();

                        gravityPulse();

                    }
                );

        }


        window.addEventListener(
            "orientationchange",
            ()=>{

                setTimeout(
                    lightweightRefresh,
                    250
                );

            }
        );


        /* =====================================
           FIRST LOAD
        ====================================== */

        setTimeout(
            ()=>{

                chatInput.focus();

            },
            500
        );


        /* =====================================
           CONSOLE STATUS
        ====================================== */

        console.log(
            "%cQUASAR",
            `
                color:#c4a5ff;
                font-size:24px;
                font-weight:700;
                letter-spacing:8px;
            `
        );


        console.log(
            "%cPersonal intelligence interface online.",
            `
                color:#999;
                font-size:12px;
            `
        );


        /* =====================================
           FINAL STATE CHECK
        ====================================== */

        if(
            !window.matchMedia(
                "(prefers-reduced-motion: reduce)"
            ).matches
        ){

            quasarCore.style.willChange =
                "transform";

            orbitLayer.style.willChange =
                "transform";

        }


        /* =====================================
           ACCESSIBILITY
        ====================================== */

        chatInput.setAttribute(
            "aria-label",
            "Message QUASAR"
        );


        sendButton.setAttribute(
            "aria-label",
            "Send message"
        );


        micButton.setAttribute(
            "aria-label",
            "Start voice input"
        );


        /* =====================================
           FINAL READY STATE
        ====================================== */

        document.documentElement
            .classList.add(
                "quasar-ready"
            );


        /* =====================================
           END OF APPLICATION
        ====================================== */

    </script>

</div>

</body>

</html>
