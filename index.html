<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>QUASAR</title>


<style>

/* =========================================
   RESET
========================================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{
    background:#050507;
    color:#ffffff;
    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    overflow-x:hidden;
}


/* =========================================
   APP
========================================= */

.app{

    min-height:100vh;
    min-height:100svh;

    display:flex;
    flex-direction:column;

    position:relative;

    background:

        radial-gradient(
            circle at 50% 42%,
            rgba(91,54,190,.09),
            transparent 34%
        ),

        radial-gradient(
            circle at 50% 80%,
            rgba(70,40,150,.05),
            transparent 35%
        ),

        #050507;

}


/* =========================================
   TOP
========================================= */

.top{

    width:100%;

    padding:
        24px
        28px
        0;

    display:flex;
    align-items:center;
    justify-content:center;

    position:relative;

    z-index:20;

}


.title{

    font-size:15px;

    font-weight:600;

    letter-spacing:.38em;

    text-indent:.38em;

    color:rgba(255,255,255,.92);

}


.status{

    position:absolute;

    right:28px;

    top:25px;

    font-size:9px;

    letter-spacing:.18em;

    color:rgba(255,255,255,.25);

}


/* =========================================
   MAIN
========================================= */

.main{

    flex:1;

    width:100%;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    text-align:center;

    padding:
        20px
        20px
        0;

}


/* =========================================
   QUASAR
========================================= */

.quasar{

    width:190px;
    height:190px;

    position:relative;

    display:flex;

    align-items:center;
    justify-content:center;

    flex-shrink:0;

    animation:
        quasarFloat
        5s
        ease-in-out
        infinite;

}


/* =========================================
   CENTRAL BLACK HOLE
========================================= */

.black-hole{

    position:absolute;

    width:76px;
    height:76px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,

            #000 0%,
            #000 57%,

            rgba(0,0,0,.96) 68%,

            transparent 74%
        );

    z-index:5;

    box-shadow:

        0 0 25px
        rgba(0,0,0,.95),

        0 0 50px
        rgba(115,70,255,.18);

}


.event-horizon{

    position:absolute;

    inset:7px;

    border-radius:50%;

    background:#000;

}


/* =========================================
   ACCRETION DISK
========================================= */

.disk{

    position:absolute;

    width:170px;
    height:55px;

    border-radius:50%;

    transform:rotate(-12deg);

    background:

        radial-gradient(
            ellipse,

            rgba(255,255,255,.95) 0%,

            rgba(255,185,90,.95) 13%,

            rgba(164,70,255,.9) 34%,

            rgba(77,48,255,.55) 55%,

            transparent 72%
        );

    filter:blur(.4px);

    z-index:3;

}


.disk-back{

    transform:
        rotate(-12deg)
        translateY(-3px)
        scale(.96);

    opacity:.82;

}


.disk-front{

    transform:
        rotate(-12deg)
        translateY(4px)
        scale(1);

    opacity:.95;

    animation:
        diskPulse
        3.2s
        ease-in-out
        infinite;

}


/* =========================================
   ENERGY RING
========================================= */

.energy-ring{

    position:absolute;

    width:128px;
    height:128px;

    border-radius:50%;

    border:
        2px solid
        rgba(170,110,255,.65);

    box-shadow:

        0 0 12px
        rgba(139,92,246,.55),

        0 0 35px
        rgba(139,92,246,.28),

        inset 0 0 15px
        rgba(139,92,246,.25);

    z-index:4;

    animation:
        ringPulse
        2.5s
        ease-in-out
        infinite;

}


/* =========================================
   QUASAR GLOW
========================================= */

.quasar-glow{

    position:absolute;

    width:180px;
    height:180px;

    border-radius:50%;

    background:

        radial-gradient(
            circle,

            rgba(120,80,255,.24),

            rgba(90,40,180,.10) 38%,

            transparent 72%
        );

    filter:blur(10px);

    animation:
        glowPulse
        3s
        ease-in-out
        infinite;

}


/* =========================================
   RELATIVISTIC JETS
========================================= */

.jet{

    position:absolute;

    width:12px;

    border-radius:50%;

    background:

        linear-gradient(
            to top,

            rgba(190,150,255,.9),

            rgba(90,60,255,.45),

            transparent
        );

    filter:blur(2px);

    opacity:.8;

    z-index:1;

    animation:
        jetPulse
        2.4s
        ease-in-out
        infinite;

}


.jet-top{

    height:145px;

    bottom:105px;

}


.jet-bottom{

    height:145px;

    top:105px;

    transform:rotate(180deg);

}


/* =========================================
   WELCOME
========================================= */

.welcome{

    margin-top:18px;

    max-width:560px;

    position:relative;

    z-index:10;

}


.welcome h2{

    font-size:26px;

    line-height:1.2;

    font-weight:500;

    letter-spacing:-.03em;

    color:rgba(255,255,255,.94);

}


.welcome p{

    margin-top:10px;

    font-size:14px;

    line-height:1.6;

    color:rgba(255,255,255,.42);

}


/* =========================================
   SUGGESTIONS
========================================= */

.suggestions{

    margin-top:24px;

    display:flex;

    flex-wrap:wrap;

    justify-content:center;

    gap:9px;

    max-width:650px;

}


.suggestion{

    border:1px solid
        rgba(255,255,255,.08);

    background:
        rgba(255,255,255,.025);

    color:
        rgba(255,255,255,.55);

    border-radius:999px;

    padding:
        10px
        15px;

    font-size:12px;

    cursor:pointer;

    transition:
        background .2s ease,
        border-color .2s ease,
        color .2s ease,
        transform .2s ease;

}


.suggestion:hover{

    background:
        rgba(255,255,255,.055);

    border-color:
        rgba(255,255,255,.14);

    color:
        rgba(255,255,255,.82);

    transform:
        translateY(-1px);

}


/* =========================================
   CHAT
========================================= */

.chat{

    width:100%;

    max-width:760px;

    margin-top:22px;

    display:flex;

    flex-direction:column;

    gap:12px;

    overflow-y:auto;

    max-height:240px;

    scrollbar-width:none;

}


.chat::-webkit-scrollbar{
    display:none;
}


.message{

    max-width:78%;

    padding:
        11px
        15px;

    border-radius:18px;

    font-size:13px;

    line-height:1.5;

    word-break:break-word;

}


.message.user{

    align-self:flex-end;

    background:
        rgba(255,255,255,.09);

    color:
        rgba(255,255,255,.9);

    border-bottom-right-radius:5px;

}


.message.assistant{

    align-self:flex-start;

    background:
        rgba(120,80,255,.08);

    border:
        1px solid
        rgba(150,110,255,.08);

    color:
        rgba(255,255,255,.65);

    border-bottom-left-radius:5px;

}


/* =========================================
   INPUT AREA
========================================= */

.input-area{

    width:100%;

    flex-shrink:0;

    padding-bottom:
        env(safe-area-inset-bottom);

    margin-bottom:28px;

}


.input-wrapper{

    width:100%;

    max-width:768px;

    margin:
        0 auto;

    padding:
        0 16px;

}


/* =========================================
   INPUT BOX
========================================= */

.input-box{

    width:100%;

    min-height:58px;

    display:flex;

    align-items:center;

    gap:5px;

    padding:
        7px
        8px
        7px
        20px;

    border-radius:999px;

    background:
        rgba(255,255,255,.055);

    border:
        1px solid
        rgba(255,255,255,.09);

    box-shadow:

        0 18px 45px
        rgba(0,0,0,.45),

        0 4px 18px
        rgba(0,0,0,.25),

        inset 0 1px 0
        rgba(255,255,255,.025);

    backdrop-filter:
        blur(20px);

    -webkit-backdrop-filter:
        blur(20px);

    transition:
        border-color .2s ease,
        background .2s ease;

}


.input-box:focus-within{

    border-color:
        rgba(160,120,255,.22);

    background:
        rgba(255,255,255,.065);

}


/* =========================================
   INPUT
========================================= */

.input-box input{

    flex:1;

    min-width:0;

    height:42px;

    border:none;

    outline:none;

    background:transparent;

    color:#fff;

    font-size:14px;

}


.input-box input::placeholder{

    color:
        rgba(255,255,255,.32);

}


/* =========================================
   ICON BUTTON
========================================= */

.icon-btn{

    width:42px;
    height:42px;

    flex-shrink:0;

    border:none;

    border-radius:50%;

    display:flex;

    align-items:center;
    justify-content:center;

    cursor:pointer;

    background:transparent;

    color:
        rgba(255,255,255,.42);

    transition:
        background .2s ease,
        color .2s ease,
        transform .2s ease;

}


.icon-btn:hover{

    background:
        rgba(255,255,255,.07);

    color:
        rgba(255,255,255,.82);

}


.icon-btn:active{

    transform:scale(.94);

}


.icon{

    width:19px;
    height:19px;

}


/* =========================================
   SEND
========================================= */

.send{

    background:
        rgba(255,255,255,.9);

    color:#050507;

}


.send:hover{

    background:#fff;

    color:#000;

}


/* =========================================
   MIC ACTIVE
========================================= */

.mic-active{

    background:
        rgba(130,90,255,.18);

    color:
        rgba(190,160,255,.95);

    animation:
        micPulse
        1.2s
        ease-in-out
        infinite;

}


/* =========================================
   ANIMATIONS
========================================= */

@keyframes quasarFloat{

    0%,
    100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-8px);
    }

}


@keyframes diskPulse{

    0%,
    100%{

        transform:
            rotate(-12deg)
            translateY(4px)
            scale(1);

    }

    50%{

        transform:
            rotate(-12deg)
            translateY(4px)
            scale(1.04);

    }

}


@keyframes ringPulse{

    0%,
    100%{

        transform:scale(.98);

        opacity:.72;

    }

    50%{

        transform:scale(1.04);

        opacity:1;

    }

}


@keyframes glowPulse{

    0%,
    100%{

        transform:scale(.95);

        opacity:.65;

    }

    50%{

        transform:scale(1.08);

        opacity:1;

    }

}


@keyframes jetPulse{

    0%,
    100%{

        opacity:.55;

    }

    50%{

        opacity:.95;

    }

}


@keyframes micPulse{

    0%,
    100%{
        box-shadow:0 0 0 rgba(140,100,255,0);
    }

    50%{
        box-shadow:
            0 0 18px
            rgba(140,100,255,.28);
    }

}


/* =========================================
   RESPONSIVE
========================================= */

@media(max-width:600px){

    .top{

        padding:
            20px
            18px
            0;

    }

    .status{

        right:18px;

        top:21px;

        font-size:8px;

    }

    .main{

        padding:
            10px
            16px
            0;

    }

    .quasar{

        width:160px;
        height:160px;

    }

    .disk{

        width:145px;

    }

    .energy-ring{

        width:110px;
        height:110px;

    }

    .black-hole{

        width:68px;
        height:68px;

    }

    .jet{

        width:10px;

    }

    .welcome h2{

        font-size:23px;

    }

    .welcome p{

        font-size:13px;

        max-width:320px;

    }

    .suggestions{

        margin-top:20px;

        gap:7px;

    }

    .suggestion{

        padding:
            9px
            12px;

        font-size:11px;

    }

    .input-area{

        margin-bottom:16px;

    }

    .input-wrapper{

        padding:
            0 16px;

    }

    .input-box{

        min-height:56px;

        padding-left:17px;

    }

}


/* =========================================
   SHORT SCREENS
========================================= */

@media(max-height:700px){

    .top{

        padding-top:16px;

    }

    .main{

        justify-content:flex-start;

        padding-top:10px;

    }

    .quasar{

        transform:scale(.82);

        margin-bottom:-18px;

    }

    .welcome{

        margin-top:4px;

    }

    .suggestions{

        margin-top:14px;

    }

}


/* =========================================
   REDUCED MOTION
========================================= */

@media(prefers-reduced-motion:reduce){

    .quasar,
    .disk,
    .energy-ring,
    .quasar-glow,
    .jet,
    .mic-active{

        animation:none;

    }

}


/* =========================================
   SAFE MOBILE INPUT
========================================= */

@supports(padding:max(0px)){

    .input-area{

        padding-bottom:
            max(
                8px,
                env(safe-area-inset-bottom)
            );

    }

}

</style>

</head>


<body>

<div class="app">
    <!-- =====================================
         TOP BAR
    ====================================== -->

    <header class="top">

        <div class="title">
            QUASAR
        </div>

        <div class="status">
            PERSONAL INTELLIGENCE
        </div>

    </header>


    <!-- =====================================
         MAIN CONTENT
    ====================================== -->

    <main class="main">


        <!-- =================================
             QUASAR CORE
        ================================== -->

        <div class="quasar">

            <!-- TOP JET -->

            <div class="jet jet-top"></div>


            <!-- BOTTOM JET -->

            <div class="jet jet-bottom"></div>


            <!-- OUTER GLOW -->

            <div class="quasar-glow"></div>


            <!-- BACK OF ACCRETION DISK -->

            <div class="disk disk-back"></div>


            <!-- BLACK HOLE -->

            <div class="black-hole">

                <div class="event-horizon"></div>

            </div>


            <!-- FRONT OF ACCRETION DISK -->

            <div class="disk disk-front"></div>


            <!-- ENERGY RING -->

            <div class="energy-ring"></div>

        </div>


        <!-- =================================
             WELCOME TEXT
        ================================== -->

        <section class="welcome">

            <h2>
                I'm online.
            </h2>

            <p>
                Ask me anything. Search, think, explore,
                or tell me what you need.
            </p>

        </section>


        <!-- =================================
             SUGGESTION CHIPS
        ================================== -->

        <div class="suggestions">


            <button
                class="suggestion"
                type="button"
                data-prompt="Find something nearby"
            >

                Find something nearby

            </button>


            <button
                class="suggestion"
                type="button"
                data-prompt="Search the web"
            >

                Search the web

            </button>


            <button
                class="suggestion"
                type="button"
                data-prompt="Plan something"
            >

                Plan something

            </button>


            <button
                class="suggestion"
                type="button"
                data-prompt="Ask QUASAR"
            >

                Ask QUASAR

            </button>


        </div>


        <!-- =================================
             CHAT MESSAGES
        ================================== -->

        <div
            class="chat"
            id="chat"
            aria-live="polite"
        ></div>


        <!--
            IMPORTANT:

            No mt-auto here.
            No giant flex spacer here.

            The main itself is flex:1 and centered.
            The input is completely outside it,
            so the input keeps its controlled
            bottom spacing.
        -->


    </main>


    <!-- =====================================
         INPUT AREA
    ====================================== -->

    <div class="input-area">


        <!--
            max-width:
            keeps the input from becoming
            ridiculously wide on desktop.

            width:100%:
            keeps it responsive.

            margin:auto:
            centers it.

            px-4 equivalent:
            16px horizontal padding.
        -->

        <div class="input-wrapper">


            <div class="input-box">


                <!-- =========================
                     TEXT INPUT
                ========================== -->

                <input
                    id="input"
                    type="text"
                    placeholder="Ask QUASAR anything..."
                    autocomplete="off"
                    aria-label="Ask QUASAR anything"
                />


                <!-- =========================
                     MICROPHONE
                ========================== -->

                <button
                    class="icon-btn"
                    id="mic"
                    type="button"
                    aria-label="Voice input"
                    title="Voice input"
                >

                    <svg
                        class="icon"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.7"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >

                        <rect
                            x="9"
                            y="3"
                            width="6"
                            height="11"
                            rx="3"
                        ></rect>

                        <path
                            d="M5 11a7 7 0 0 0 14 0"
                        ></path>

                        <path
                            d="M12 18v3"
                        ></path>

                        <path
                            d="M8 21h8"
                        ></path>

                    </svg>

                </button>


                <!-- =========================
                     SEND
                ========================== -->

                <button
                    class="icon-btn send"
                    id="send"
                    type="button"
                    aria-label="Send message"
                    title="Send message"
                >

                    <svg
                        class="icon"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >

                        <path
                            d="M22 2L11 13"
                        ></path>

                        <path
                            d="M22 2L15 22L11 13L2 9L22 2Z"
                        ></path>

                    </svg>

                </button>


            </div>


        </div>


    </div>
<script>

/* =========================================
   ELEMENTS
========================================= */

const input =
    document.getElementById("input");

const send =
    document.getElementById("send");

const mic =
    document.getElementById("mic");

const chat =
    document.getElementById("chat");

const suggestions =
    document.querySelectorAll(".suggestion");


/* =========================================
   ADD MESSAGE
========================================= */

function addMessage(text, type){

    const message =
        document.createElement("div");

    message.className =
        "message " + type;

    message.textContent =
        text;

    chat.appendChild(message);

    chat.scrollTop =
        chat.scrollHeight;
}


/* =========================================
   SEND MESSAGE
========================================= */

function sendMessage(){

    const text =
        input.value.trim();


    if(!text){

        input.focus();

        return;
    }


    /* USER MESSAGE */

    addMessage(
        text,
        "user"
    );


    /* CLEAR INPUT */

    input.value = "";


    /* TEMPORARY QUASAR RESPONSE */

    setTimeout(() => {

        addMessage(
            "I'm online. Real intelligence will be connected next.",
            "assistant"
        );

    }, 500);


    input.focus();

}


/* =========================================
   SEND BUTTON
========================================= */

send.addEventListener(
    "click",
    sendMessage
);


/* =========================================
   ENTER TO SEND
========================================= */

input.addEventListener(
    "keydown",
    (event) => {

        if(event.key === "Enter"){

            event.preventDefault();

            sendMessage();

        }

    }
);


/* =========================================
   SUGGESTION CHIPS
========================================= */

suggestions.forEach(
    (button) => {

        button.addEventListener(
            "click",
            () => {

                const prompt =
                    button.dataset.prompt ||
                    button.textContent.trim();


                input.value =
                    prompt;

                input.focus();

            }
        );

    }
);


/* =========================================
   VOICE RECOGNITION
========================================= */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


if(SpeechRecognition){

    const recognition =
        new SpeechRecognition();


    recognition.lang =
        "en-US";


    recognition.continuous =
        false;


    recognition.interimResults =
        false;


    /* ==============================
       START LISTENING
    =============================== */

    mic.addEventListener(
        "click",
        () => {

            try{

                recognition.start();

                mic.classList.add(
                    "mic-active"
                );

            }
            catch(error){

                /*
                    Browser may throw an error
                    if recognition is already running.
                */

                console.log(
                    "Voice recognition is already active."
                );

            }

        }
    );


    /* ==============================
       SPEECH RESULT
    =============================== */

    recognition.addEventListener(
        "result",
        (event) => {

            const transcript =
                event
                    .results[0][0]
                    .transcript;


            input.value =
                transcript;

            input.focus();

        }
    );


    /* ==============================
       RECOGNITION ENDED
    =============================== */

    recognition.addEventListener(
        "end",
        () => {

            mic.classList.remove(
                "mic-active"
            );

        }
    );


    /* ==============================
       RECOGNITION ERROR
    =============================== */

    recognition.addEventListener(
        "error",
        () => {

            mic.classList.remove(
                "mic-active"
            );

        }
    );

}
else{

    /*
        Fallback for browsers
        without Speech Recognition.
    */

    mic.addEventListener(
        "click",
        () => {

            input.focus();

        }
    );

}


/* =========================================
   INITIAL FOCUS
========================================= */

window.addEventListener(
    "load",
    () => {

        input.focus();

    }
);

</script>


</div>

</body>

</html>
