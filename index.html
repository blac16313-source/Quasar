<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>QUASAR</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    background:#050608;
    color:#fff;
    font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

/* =========================
   BACKGROUND
========================= */

body::before{
    content:"";
    position:fixed;
    width:500px;
    height:500px;
    top:-220px;
    left:50%;
    transform:translateX(-50%);
    background:radial-gradient(
        circle,
        rgba(113,72,255,.14),
        rgba(113,72,255,.04) 40%,
        transparent 70%
    );
    pointer-events:none;
}

body::after{
    content:"";
    position:fixed;
    width:420px;
    height:420px;
    bottom:-250px;
    right:-180px;
    background:radial-gradient(
        circle,
        rgba(66,92,255,.08),
        transparent 70%
    );
    pointer-events:none;
}

/* =========================
   APP
========================= */

.app{
    width:100%;
    height:100dvh;
    min-height:100vh;

    display:flex;
    flex-direction:column;

    position:relative;
}

/* =========================
   TOP
========================= */

.top{
    flex-shrink:0;

    height:150px;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    padding-top:18px;
}

.logo{
    width:52px;
    height:52px;

    object-fit:contain;

    filter:
        drop-shadow(0 0 12px rgba(125,91,255,.35));

    margin-bottom:9px;
}

.title{
    font-size:18px;
    font-weight:600;
    letter-spacing:6px;

    margin-left:6px;

    color:#f4f2ff;
}

.status{
    margin-top:7px;

    font-size:8px;
    letter-spacing:3px;

    color:#777687;
}

/* =========================
   MAIN
========================= */

.main{
    flex:1;
    min-height:0;

    display:flex;
    flex-direction:column;
    align-items:center;

    position:relative;

    padding:10px 20px 0;
}

/* =========================
   ORB
========================= */

.core{
    width:125px;
    height:125px;

    border-radius:50%;

    margin-top:10px;
    margin-bottom:28px;

    position:relative;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        radial-gradient(
            circle at 35% 30%,
            rgba(255,255,255,.95) 0%,
            rgba(173,155,255,.75) 8%,
            rgba(95,67,220,.5) 28%,
            rgba(36,25,87,.8) 55%,
            rgba(5,6,8,0) 72%
        );

    box-shadow:
        0 0 35px rgba(105,75,255,.25),
        0 0 90px rgba(74,51,190,.12);

    animation:
        floating 5s ease-in-out infinite;
}

.core::before{
    content:"";

    position:absolute;

    inset:-18px;

    border-radius:50%;

    border:1px solid rgba(128,105,255,.12);

    box-shadow:
        0 0 30px rgba(112,86,255,.08);
}

.core::after{
    content:"";

    position:absolute;

    inset:-35px;

    border-radius:50%;

    border:1px solid rgba(128,105,255,.05);
}

@keyframes floating{
    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-7px);
    }
}

/* =========================
   WELCOME
========================= */

.welcome{
    text-align:center;

    max-width:500px;
}

.welcome h2{
    font-size:20px;
    font-weight:500;

    color:#dddbe8;

    margin-bottom:8px;
}

.welcome p{
    font-size:13px;
    line-height:1.6;

    color:#686775;
}

/* =========================
   SUGGESTIONS
========================= */

.suggestions{
    display:flex;
    gap:9px;

    margin-top:25px;

    flex-wrap:wrap;
    justify-content:center;

    max-width:600px;
}

.suggestion{
    border:1px solid rgba(255,255,255,.07);

    background:rgba(255,255,255,.025);

    color:#8d8b99;

    border-radius:100px;

    padding:9px 14px;

    font-size:11px;

    cursor:pointer;

    transition:.2s;
}

.suggestion:hover{
    background:rgba(255,255,255,.06);
    border-color:rgba(150,125,255,.25);
    color:#c9c4e7;
}

/* =========================
   CHAT
========================= */

.chat{
    width:100%;
    max-width:760px;

    flex:1;
    min-height:0;

    overflow-y:auto;

    padding:15px 0;

    display:flex;
    flex-direction:column;
    gap:10px;

    scrollbar-width:none;
}

.chat::-webkit-scrollbar{
    display:none;
}

.message{
    max-width:80%;

    padding:12px 15px;

    border-radius:15px;

    font-size:13px;
    line-height:1.5;
}

.user{
    align-self:flex-end;

    background:#17151f;

    color:#d8d5df;

    border:1px solid rgba(255,255,255,.05);
}

.assistant{
    align-self:flex-start;

    background:rgba(255,255,255,.025);

    color:#aaa8b4;

    border:1px solid rgba(255,255,255,.04);
}

/* =========================
   INPUT AREA
========================= */

.input-area{
    flex-shrink:0;

    width:100%;

    display:flex;
    justify-content:center;

    padding:
        8px
        20px
        max(22px, env(safe-area-inset-bottom));

    position:relative;
    z-index:10;
}

.input-box{
    width:100%;
    max-width:760px;

    min-height:58px;

    display:flex;
    align-items:center;

    padding:7px 8px 7px 18px;

    border-radius:18px;

    background:rgba(18,18,22,.96);

    border:1px solid rgba(255,255,255,.08);

    box-shadow:
        0 10px 40px rgba(0,0,0,.4),
        0 0 30px rgba(90,70,180,.04);

    backdrop-filter:blur(20px);
}

.input-box input{
    flex:1;

    min-width:0;

    border:0;
    outline:0;

    background:transparent;

    color:#eee;

    font-size:14px;

    font-family:inherit;
}

.input-box input::placeholder{
    color:#62616d;
}

/* =========================
   BUTTONS
========================= */

.icon-btn{
    width:42px;
    height:42px;

    flex-shrink:0;

    border-radius:13px;

    border:1px solid rgba(255,255,255,.06);

    background:rgba(255,255,255,.035);

    color:#888693;

    display:flex;
    align-items:center;
    justify-content:center;

    cursor:pointer;

    transition:.2s;
}

.icon-btn:hover{
    background:rgba(255,255,255,.08);
    color:#ddd;
}

.send{
    margin-left:7px;

    background:#eee;

    color:#08080a;

    border:0;
}

.send:hover{
    background:#fff;

    color:#000;
}

.icon{
    width:17px;
    height:17px;
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .top{
        height:125px;
        padding-top:12px;
    }

    .logo{
        width:45px;
        height:45px;
        margin-bottom:7px;
    }

    .title{
        font-size:16px;
        letter-spacing:5px;
    }

    .status{
        font-size:7px;
        margin-top:5px;
    }

    .main{
        padding:
            0
            15px
            0;
    }

    .core{
        width:105px;
        height:105px;

        margin-top:5px;
        margin-bottom:22px;
    }

    .welcome h2{
        font-size:18px;
    }

    .welcome p{
        font-size:12px;
    }

    .suggestions{
        margin-top:18px;
        gap:7px;
    }

    .suggestion{
        font-size:10px;
        padding:8px 12px;
    }

    .input-area{
        padding:
            7px
            12px
            max(18px, env(safe-area-inset-bottom));
    }

    .input-box{
        min-height:55px;

        border-radius:17px;

        padding-left:15px;
    }

    .icon-btn{
        width:40px;
        height:40px;
    }
}

/* =========================
   SMALL HEIGHT PHONES
========================= */

@media(max-height:700px){

    .top{
        height:105px;
    }

    .logo{
        width:38px;
        height:38px;
    }

    .core{
        width:85px;
        height:85px;

        margin-bottom:15px;
    }

    .welcome h2{
        font-size:16px;
    }

    .welcome p{
        font-size:11px;
    }

    .suggestions{
        margin-top:13px;
    }

    .suggestion{
        padding:6px 10px;
    }
}
</style>
</head>

<body>

<div class="app">

    <!-- TOP -->
    <header class="top">

        <img
            class="logo"
            src="assets/quasar-logo.png"
            alt="QUASAR"
        >

        <div class="title">QUASAR</div>

        <div class="status">PERSONAL INTELLIGENCE</div>

    </header>


    <!-- MAIN -->
    <main class="main">

        <div class="core"></div>

        <div class="welcome">

            <h2>I'm online.</h2>

            <p>
                Ask me anything. Search, think, explore,
                or tell me what you need.
            </p>

        </div>


        <div class="suggestions">

            <button class="suggestion">
                Find something nearby
            </button>

            <button class="suggestion">
                Search the web
            </button>

            <button class="suggestion">
                Plan something
            </button>

            <button class="suggestion">
                Ask QUASAR
            </button>

        </div>


        <div class="chat" id="chat"></div>

    </main>


    <!-- INPUT -->
    <div class="input-area">

        <div class="input-box">

            <input
                id="input"
                type="text"
                placeholder="Ask QUASAR anything..."
                autocomplete="off"
            >

            <button
                class="icon-btn"
                id="mic"
                aria-label="Voice input"
            >
                <svg
                    class="icon"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.7"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >
                    <rect
                        x="9"
                        y="3"
                        width="6"
                        height="11"
                        rx="3"
                    ></rect>

                    <path d="M5 11a7 7 0 0 0 14 0"></path>
                    <path d="M12 18v3"></path>
                    <path d="M8 21h8"></path>
                </svg>
            </button>


            <button
                class="icon-btn send"
                id="send"
                aria-label="Send"
            >
                <svg
                    class="icon"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >
                    <path d="M22 2L11 13"></path>
                    <path d="M22 2L15 22L11 13L2 9L22 2Z"></path>
                </svg>
            </button>

        </div>

    </div>

</div>


<script>

const input = document.getElementById("input");
const send = document.getElementById("send");
const mic = document.getElementById("mic");
const chat = document.getElementById("chat");


function sendMessage(){

    const text = input.value.trim();

    if(!text) return;

    const userMessage = document.createElement("div");

    userMessage.className = "message user";

    userMessage.textContent = text;

    chat.appendChild(userMessage);

    input.value = "";

    chat.scrollTop = chat.scrollHeight;


    setTimeout(() => {

        const assistantMessage =
            document.createElement("div");

        assistantMessage.className =
            "message assistant";

        assistantMessage.textContent =
            "I'm online. Real intelligence will be connected next.";

        chat.appendChild(assistantMessage);

        chat.scrollTop = chat.scrollHeight;

    },500);
}


send.addEventListener("click", sendMessage);


input.addEventListener("keydown", (e) => {

    if(e.key === "Enter"){
        sendMessage();
    }

});


/* VOICE */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


if(SpeechRecognition){

    const recognition =
        new SpeechRecognition();

    recognition.lang = "en-US";

    recognition.continuous = false;

    recognition.interimResults = false;


    mic.addEventListener("click", () => {

        recognition.start();

    });


    recognition.onresult = (event) => {

        input.value =
            event.results[0][0].transcript;

        input.focus();

    };

}

</script>

</body>
</html>
