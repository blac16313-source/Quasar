<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#000000">

<title>QUASAR</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  color:#fff;
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,
  BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
  touch-action:none;
}

button,
input{
  font:inherit;
}

button{
  border:0;
}

#app{
  position:relative;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
}

/* =========================
   HEADER
========================= */

.header{
  position:absolute;
  left:24px;
  top:20px;
  z-index:100;

  color:#fff;
  font-size:12px;
  font-weight:600;
  letter-spacing:.42em;
}

/* =========================
   MAIN VOID
========================= */

#void{
  position:absolute;
  inset:0;
  overflow:hidden;
}

/* =========================
   QUASAR
========================= */

#quasar{
  position:absolute;

  left:50%;
  top:108px;

  width:210px;
  height:210px;

  transform:translateX(-50%);

  z-index:40;

  cursor:pointer;

  animation:
    quasarFloat 5s ease-in-out infinite;
}

@keyframes quasarFloat{

  0%,100%{
    transform:translateX(-50%) translateY(0);
  }

  50%{
    transform:translateX(-50%) translateY(-7px);
  }
}

/* =========================
   SPINNING RAYS
========================= */

.ray-field{
  position:absolute;
  inset:-35px;

  pointer-events:none;

  animation:
    raySpin 18s linear infinite;
}

.ray-field i{
  position:absolute;

  left:50%;
  top:50%;

  width:1px;
  height:105px;

  transform-origin:50% 0;

  background:
    linear-gradient(
      to bottom,
      rgba(215,185,255,.75),
      rgba(145,90,255,.15),
      transparent
    );

  filter:blur(.5px);

  opacity:.7;
}

.ray-field i:nth-child(1){
  transform:translate(-50%,0) rotate(0deg);
}

.ray-field i:nth-child(2){
  transform:translate(-50%,0) rotate(45deg);
}

.ray-field i:nth-child(3){
  transform:translate(-50%,0) rotate(90deg);
}

.ray-field i:nth-child(4){
  transform:translate(-50%,0) rotate(135deg);
}

.ray-field i:nth-child(5){
  transform:translate(-50%,0) rotate(180deg);
}

.ray-field i:nth-child(6){
  transform:translate(-50%,0) rotate(225deg);
}

.ray-field i:nth-child(7){
  transform:translate(-50%,0) rotate(270deg);
}

.ray-field i:nth-child(8){
  transform:translate(-50%,0) rotate(315deg);
}

@keyframes raySpin{

  to{
    transform:rotate(360deg);
  }

}

/* =========================
   ACCRETION DISK
========================= */

.accretion{
  position:absolute;

  left:50%;
  top:50%;

  width:184px;
  height:62px;

  transform:
    translate(-50%,-50%)
    rotate(-18deg);

  border-radius:50%;

  border:
    1px solid rgba(202,166,255,.32);

  box-shadow:
    0 0 24px rgba(132,78,220,.22),
    inset 0 0 22px rgba(160,100,255,.12);

  animation:
    accretionPulse 2.2s ease-in-out infinite;
}

@keyframes accretionPulse{

  0%,100%{
    filter:brightness(.8);

    transform:
      translate(-50%,-50%)
      rotate(-18deg)
      scale(1);
  }

  50%{
    filter:brightness(1.35);

    transform:
      translate(-50%,-50%)
      rotate(-18deg)
      scale(1.045);
  }
}

/* =========================
   BLACK HOLE
========================= */

.hole{
  position:absolute;

  left:50%;
  top:50%;

  width:92px;
  height:92px;

  border-radius:50%;

  transform:
    translate(-50%,-50%);

  background:#000;

  box-shadow:
    0 0 28px 8px rgba(82,38,160,.24),
    0 0 90px 24px rgba(61,28,135,.12);
}

.core{
  position:absolute;

  left:50%;
  top:50%;

  width:24px;
  height:24px;

  border-radius:50%;

  transform:
    translate(-50%,-50%);

  background:#000;

  box-shadow:
    0 0 25px 5px rgba(183,135,255,.28);
}

/* =========================
   OUTER RINGS
========================= */

.ring{
  position:absolute;

  left:50%;
  top:50%;

  width:190px;
  height:190px;

  border-radius:50%;

  transform:
    translate(-50%,-50%)
    rotate(-18deg);

  border:
    1px solid rgba(178,130,255,.18);

  box-shadow:
    0 0 55px rgba(93,48,170,.18),
    inset 0 0 35px rgba(105,55,190,.08);
}

.ring.r2{
  width:165px;
  height:78px;

  border-color:
    rgba(200,160,255,.28);

  transform:
    translate(-50%,-50%)
    rotate(-20deg);
}

.ring.r3{
  width:185px;
  height:65px;

  border-color:
    rgba(145,100,255,.12);

  transform:
    translate(-50%,-50%)
    rotate(20deg);
}

/* =========================
   THINKING BEAM
========================= */

.beam{
  position:absolute;

  left:50%;
  top:50%;

  width:2px;
  height:210px;

  transform:
    translate(-50%,-50%);

  background:
    linear-gradient(
      to bottom,
      transparent,
      rgba(150,100,255,.7),
      transparent
    );

  filter:blur(1px);

  opacity:.18;
}

.thinking .beam{
  opacity:.95;

  animation:
    beamPulse .36s ease-in-out infinite alternate;
}

@keyframes beamPulse{

  from{
    height:175px;
    filter:blur(2px);
  }

  to{
    height:250px;
    filter:blur(.5px);
  }
}

/* =========================
   THINKING PARTICLES
========================= */

.think-particle{
  position:absolute;

  width:3px;
  height:3px;

  border-radius:50%;

  background:#d5bcff;

  box-shadow:
    0 0 8px #a46fff;

  pointer-events:none;

  z-index:45;
}

/* =========================
   CONVERSATION
========================= */

#conversation{
  position:absolute;

  left:50%;
  top:350px;

  transform:
    translateX(-50%);

  width:min(680px,88vw);

  max-height:30vh;

  overflow:hidden;

  z-index:35;

  display:flex;
  flex-direction:column;

  align-items:center;

  gap:9px;

  pointer-events:none;

  mask-image:
    linear-gradient(
      to bottom,
      transparent,
      #000 15%,
      #000 82%,
      transparent
    );
}

.message{
  max-width:min(560px,84vw);

  padding:9px 14px;

  border-radius:16px;

  font-size:11px;
  line-height:1.5;

  opacity:0;

  transform:
    translateY(10px);

  animation:
    messageIn .4s ease forwards;

  backdrop-filter:blur(10px);
}

.message.user{
  color:#dcd3ed;

  background:
    rgba(20,14,31,.72);

  border:
    1px solid rgba(185,145,255,.12);
}

.message.assistant{
  color:#eee7fa;

  background:
    rgba(15,10,24,.5);

  border:
    1px solid rgba(190,150,255,.08);
}

@keyframes messageIn{

  to{
    opacity:1;
    transform:
      translateY(0);
  }

}

/* =========================
   COSMIC MODE
========================= */

#mandala{
  position:absolute;

  left:50%;
  top:112px;

  width:360px;
  height:360px;

  transform:
    translateX(-50%);

  z-index:9;

  opacity:0;

  pointer-events:none;

  transition:
    opacity .7s;
}

.cosmic #mandala{
  opacity:.08;
}

#mandala svg{
  width:100%;
  height:100%;

  animation:
    mandalaSpin 42s linear infinite;
}

@keyframes mandalaSpin{

  to{
    transform:rotate(360deg);
  }

}

#mode{
  position:absolute;

  left:50%;
  top:326px;

  transform:
    translateX(-50%);

  z-index:50;

  opacity:0;

  color:#b99bdf;

  font-size:8px;

  letter-spacing:.45em;

  pointer-events:none;

  transition:.4s;
}

.cosmic #mode{
  opacity:.35;
}

/* =========================
   TOAST
========================= */

#toast{
  position:absolute;

  left:50%;
  top:78px;

  transform:
    translateX(-50%)
    translateY(-8px);

  z-index:90;

  opacity:0;

  pointer-events:none;

  color:#aaa;

  font-size:9px;

  letter-spacing:.16em;

  transition:.3s;
}

#toast.show{
  opacity:1;

  transform:
    translateX(-50%)
    translateY(0);
}

/* =========================
   DRAW CANVAS
========================= */

#drawCanvas{
  position:absolute;

  inset:0;

  width:100%;
  height:100%;

  z-index:20;

  pointer-events:auto;

  cursor:crosshair;
}

/* =========================
   SUMMON SUGGESTIONS
========================= */

#suggestions{
  position:absolute;

  left:50%;
  top:48%;

  transform:
    translate(-50%,-50%)
    scale(.96);

  z-index:70;

  opacity:0;

  pointer-events:none;

  transition:.25s ease;

  width:min(300px,82vw);

  padding:14px;

  border:
    1px solid rgba(185,145,255,.15);

  border-radius:18px;

  background:
    rgba(8,6,13,.9);

  backdrop-filter:blur(18px);

  box-shadow:
    0 20px 70px rgba(0,0,0,.6);
}

#suggestions.show{
  opacity:1;

  pointer-events:auto;

  transform:
    translate(-50%,-50%)
    scale(1);
}

.s-title{
  font-size:9px;

  letter-spacing:.2em;

  color:#a990d2;

  margin-bottom:10px;
}

.s-btn{
  display:block;

  width:100%;

  background:
    rgba(255,255,255,.035);

  color:#e9e1f7;

  border-radius:10px;

  padding:10px;

  margin-top:6px;

  text-align:left;

  font-size:11px;

  cursor:pointer;
}

.s-btn:active{
  background:
    rgba(170,120,255,.12);
}

/* =========================
   COMPOSER
========================= */

#composer{
  position:absolute;

  left:18px;
  right:18px;
  bottom:24px;

  z-index:100;

  display:flex;
  align-items:center;

  gap:8px;

  max-width:760px;

  margin:auto;

  padding:
    7px 8px 7px 14px;

  border:
    1px solid rgba(255,255,255,.12);

  border-radius:22px;

  background:
    rgba(8,8,10,.86);

  backdrop-filter:blur(18px);

  box-shadow:
    0 16px 60px rgba(0,0,0,.5);

  transition:.25s;
}

#composer:focus-within{
  border-color:
    rgba(190,150,255,.25);

  box-shadow:
    0 18px 65px rgba(0,0,0,.6),
    0 0 30px rgba(105,65,190,.08);
}

#input{
  flex:1;

  min-width:0;

  border:0;
  outline:0;

  background:transparent;

  color:#fff;

  font-size:13px;

  padding:9px 0;
}

#input::placeholder{
  color:#68646e;
}

.c-btn{
  width:34px;
  height:34px;

  border-radius:50%;

  background:transparent;

  color:#888;

  display:grid;
  place-items:center;

  cursor:pointer;
}

.c-btn:hover{
  color:#ddd;

  background:
    rgba(255,255,255,.05);
}

#send{
  background:#eee;
  color:#080808;
}

#send:hover{
  background:#fff;
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

  .header{
    left:18px;
    top:17px;
  }

  #quasar{
    top:82px;

    transform:
      translateX(-50%)
      scale(.82);
  }

  #conversation{
    top:292px;
    max-height:34vh;
  }

  #mandala{
    top:75px;

    transform:
      translateX(-50%)
      scale(.82);
  }

  #mode{
    top:278px;
  }

  #composer{
    bottom:18px;
  }
}

/* =========================
   REDUCED MOTION
========================= */

@media(prefers-reduced-motion:reduce){

  *,
  *::before,
  *::after{
    animation-duration:.001ms!important;
    animation-iteration-count:1!important;
    transition-duration:.001ms!important;
  }
}
</style>
</head>

<body>

<div id="app">

  <!-- =========================
       HEADER
  ========================== -->

  <div class="header">
    QUASAR
  </div>


  <!-- =========================
       TOAST
  ========================== -->

  <div id="toast"></div>


  <!-- =========================
       MAIN VOID
  ========================== -->

  <div id="void">


    <!-- =========================
         COSMIC MODE MANDALA
    ========================== -->

    <div id="mandala" aria-hidden="true">

      <svg viewBox="0 0 360 360">

        <g
          fill="none"
          stroke="white"
          stroke-width="1"
        >

          <circle
            cx="180"
            cy="180"
            r="145"
          />

          <circle
            cx="180"
            cy="180"
            r="115"
          />

          <circle
            cx="180"
            cy="180"
            r="78"
          />

          <circle
            cx="180"
            cy="180"
            r="42"
          />


          <path
            d="
              M180 25
              L215 180
              L180 335
              L145 180
              Z
            "
          />


          <path
            d="
              M25 180
              L180 215
              L335 180
              L180 145
              Z
            "
          />


          <path
            d="
              M77 77
              L283 283

              M283 77
              L77 283
            "
          />


          <path
            d="
              M180 35
              C255 35 325 105 325 180
              C325 255 255 325 180 325
              C105 325 35 255 35 180
              C35 105 105 35 180 35
              Z
            "
          />

        </g>

      </svg>

    </div>


    <!-- =========================
         QUASAR / BLACK HOLE
    ========================== -->

    <div
      id="quasar"
      title="Hold for Cosmic Mode"
    >

      <!-- Rotating rays -->

      <div class="ray-field">

        <i></i>
        <i></i>
        <i></i>
        <i></i>

        <i></i>
        <i></i>
        <i></i>
        <i></i>

      </div>


      <!-- Thinking beam -->

      <div class="beam"></div>


      <!-- Outer energy rings -->

      <div class="ring"></div>

      <div class="ring r2"></div>

      <div class="ring r3"></div>


      <!-- Accretion disk -->

      <div class="accretion"></div>


      <!-- Black hole -->

      <div class="hole"></div>


      <!-- Central core -->

      <div class="core"></div>

    </div>


    <!-- =========================
         CONVERSATION
         
         User messages appear here.
         AI messages will ONLY appear
         when the real backend sends them.
    ========================== -->

    <div
      id="conversation"
      aria-live="polite"
      aria-label="Conversation"
    ></div>


    <!-- =========================
         DRAW-TO-SUMMON CANVAS
    ========================== -->

    <canvas
      id="drawCanvas"
    ></canvas>


    <!-- =========================
         SUMMON MENU
    ========================== -->

    <div id="suggestions">

      <div class="s-title">
        SUMMON
      </div>


      <button
        class="s-btn"
        type="button"
      >
        What can you do?
      </button>


      <button
        class="s-btn"
        type="button"
      >
        Search the web
      </button>


      <button
        class="s-btn"
        type="button"
      >
        Remember this
      </button>

    </div>


    <!-- =========================
         MODE INDICATOR
    ========================== -->

    <div id="mode"></div>

  </div>


  <!-- =========================
       BOTTOM COMPOSER
  ========================== -->

  <form id="composer">

    <input
      id="input"
      autocomplete="off"
      placeholder="Ask QUASAR anything..."
      aria-label="Message QUASAR"
    />


    <button
      class="c-btn"
      id="mic"
      type="button"
      aria-label="Voice input"
    >
      ⌁
    </button>


    <button
      class="c-btn"
      id="send"
      type="submit"
      aria-label="Send message"
    >
      ↑
    </button>

  </form>

</div>
<script>
(() => {

"use strict";


/* =========================================================
   QUASAR UI ENGINE

   IMPORTANT:
   There is NO AI logic in this file.

   User message:
      → appears in conversation
      → "quasar:message" event is dispatched
      → thinking animation starts

   Real backend later:
      → sends response
      → window.QuasarUI.addAssistantMessage("...")
========================================================= */


/* =========================================================
   ELEMENTS
========================================================= */

const app =
  document.getElementById("app");

const quasar =
  document.getElementById("quasar");

const conversation =
  document.getElementById("conversation");

const drawCanvas =
  document.getElementById("drawCanvas");

const drawCtx =
  drawCanvas.getContext("2d");

const suggestions =
  document.getElementById("suggestions");

const composer =
  document.getElementById("composer");

const input =
  document.getElementById("input");

const mic =
  document.getElementById("mic");

const toast =
  document.getElementById("toast");

const mode =
  document.getElementById("mode");


/* =========================================================
   STATE
========================================================= */

let messages = [];

let cosmicMode = false;

let thinking = false;

let longPressTimer = null;

let toastTimer = null;

let drawing = false;

let drawPoints = [];


/* =========================================================
   TOAST
========================================================= */

function showToast(text){

  toast.textContent = text;

  toast.classList.add("show");

  clearTimeout(toastTimer);

  toastTimer =
    setTimeout(() => {

      toast.classList.remove("show");

    }, 1300);
}


/* =========================================================
   CANVAS RESIZE
========================================================= */

function resizeCanvas(){

  const dpr =
    Math.min(
      window.devicePixelRatio || 1,
      2
    );

  const rect =
    drawCanvas.getBoundingClientRect();


  drawCanvas.width =
    Math.max(
      1,
      Math.round(rect.width * dpr)
    );

  drawCanvas.height =
    Math.max(
      1,
      Math.round(rect.height * dpr)
    );


  drawCtx.setTransform(
    dpr,
    0,
    0,
    dpr,
    0,
    0
  );
}


/* =========================================================
   CONVERSATION RENDERING
========================================================= */

function renderMessages(){

  conversation.innerHTML = "";


  /*
    Only the latest few messages are shown.
    The actual state can contain more.
  */

  const visible =
    messages.slice(-5);


  visible.forEach(message => {

    const element =
      document.createElement("div");


    element.className =
      "message " +
      (
        message.role === "assistant"
          ? "assistant"
          : "user"
      );


    element.textContent =
      message.text;


    conversation.appendChild(element);

  });

}


/* =========================================================
   USER MESSAGE
========================================================= */

function addUserMessage(text){

  if(!text){
    return;
  }


  messages.push({

    role: "user",

    text: text

  });


  /*
    Keep memory inside the UI small.
    Real persistent memory will live in the backend.
  */

  if(messages.length > 20){

    messages =
      messages.slice(-20);

  }


  renderMessages();


  /*
    THIS is the bridge to the future AI.

    Nothing answers here.

    Your backend will eventually listen
    for this event.
  */

  window.dispatchEvent(

    new CustomEvent(
      "quasar:message",
      {

        detail: {

          text: text,

          cosmicMode:
            cosmicMode,

          messages:
            [...messages]

        }

      }

    )

  );

}


/* =========================================================
   REAL ASSISTANT MESSAGE BRIDGE
========================================================= */

function addAssistantMessage(text){

  if(
    typeof text !== "string" ||
    !text.trim()
  ){

    return;

  }


  messages.push({

    role: "assistant",

    text: text.trim()

  });


  if(messages.length > 20){

    messages =
      messages.slice(-20);

  }


  renderMessages();


  stopThinking();

}


/* =========================================================
   THINKING MODE
========================================================= */

function startThinking(){

  if(thinking){
    return;
  }


  thinking = true;


  app.classList.add(
    "thinking"
  );


  /*
    Remove previous thinking particles.
  */

  document
    .querySelectorAll(
      ".think-particle"
    )
    .forEach(
      particle =>
        particle.remove()
    );


  /*
    Create rising particles.
  */

  for(let i = 0; i < 14; i++){

    const particle =
      document.createElement("div");


    particle.className =
      "think-particle";


    particle.style.left =
      (
        50 +
        (Math.random() - .5) * 5
      ) + "%";


    particle.style.top =
      (
        180 +
        Math.random() * 120
      ) + "px";


    particle.animate(

      [

        {
          transform:
            "translateY(70px) scale(.25)",

          opacity: 0

        },

        {

          transform:
            "translateY(0) scale(1)",

          opacity: .8

        },

        {

          transform:
            "translateY(-120px) scale(.1)",

          opacity: 0

        }

      ],

      {

        duration:
          650 +
          Math.random() * 600,

        delay:
          Math.random() * 500,

        iterations:
          Infinity

      }

    );


    app.appendChild(
      particle
    );

  }

}


/* =========================================================
   STOP THINKING
========================================================= */

function stopThinking(){

  thinking = false;


  app.classList.remove(
    "thinking"
  );


  document
    .querySelectorAll(
      ".think-particle"
    )
    .forEach(
      particle =>
        particle.remove()
    );

}


/* =========================================================
   COSMIC MODE
========================================================= */

function setCosmicMode(enabled){

  cosmicMode =
    Boolean(enabled);


  app.classList.toggle(
    "cosmic",
    cosmicMode
  );


  mode.textContent =
    cosmicMode
      ? "COSMIC"
      : "";


  showToast(

    cosmicMode
      ? "COSMIC MODE"
      : "NORMAL MODE"

  );

}


/* =========================================================
   LONG PRESS
========================================================= */

function beginLongPress(){

  clearTimeout(
    longPressTimer
  );


  longPressTimer =
    setTimeout(() => {

      setCosmicMode(
        !cosmicMode
      );


      longPressTimer =
        null;

    }, 500);

}


function cancelLongPress(){

  clearTimeout(
    longPressTimer
  );

  longPressTimer =
    null;

}


/* =========================================================
   QUASAR INTERACTION
========================================================= */

quasar.addEventListener(
  "pointerdown",
  beginLongPress
);


quasar.addEventListener(
  "pointerup",
  cancelLongPress
);


quasar.addEventListener(
  "pointercancel",
  cancelLongPress
);


quasar.addEventListener(
  "pointerleave",
  cancelLongPress
);


/*
  Small visual reaction when tapped.
*/

quasar.addEventListener(
  "click",
  () => {

    if(thinking){
      return;
    }


    quasar.animate(

      [

        {
          transform:
            "translateX(-50%) scale(1)"
        },

        {
          transform:
            "translateX(-50%) scale(1.07)"
        },

        {
          transform:
            "translateX(-50%) scale(1)"
        }

      ],

      {

        duration: 420,

        easing: "ease-out"

      }

    );

  }
);


/* =========================================================
   DRAWING
========================================================= */

function getCanvasPoint(event){

  const rect =
    drawCanvas.getBoundingClientRect();


  return {

    x:
      event.clientX -
      rect.left,

    y:
      event.clientY -
      rect.top

  };

}


function clearDrawing(){

  drawCtx.clearRect(

    0,
    0,

    drawCanvas.clientWidth,
    drawCanvas.clientHeight

  );

}


function drawPath(){

  clearDrawing();


  if(drawPoints.length < 2){

    return;

  }


  drawCtx.beginPath();


  drawCtx.moveTo(

    drawPoints[0].x,
    drawPoints[0].y

  );


  for(
    let i = 1;
    i < drawPoints.length;
    i++
  ){

    drawCtx.lineTo(

      drawPoints[i].x,
      drawPoints[i].y

    );

  }


  drawCtx.strokeStyle =
    "rgba(190,145,255,.8)";


  drawCtx.lineWidth = 2;

  drawCtx.lineCap =
    "round";


  drawCtx.shadowBlur = 15;

  drawCtx.shadowColor =
    "rgba(150,90,255,.8)";


  drawCtx.stroke();


  drawCtx.shadowBlur = 0;

}


/* =========================================================
   CIRCLE DETECTION
========================================================= */

function looksLikeCircle(){

  if(
    drawPoints.length < 18
  ){

    return false;

  }


  const first =
    drawPoints[0];

  const last =
    drawPoints[
      drawPoints.length - 1
    ];


  const xs =
    drawPoints.map(
      point => point.x
    );


  const ys =
    drawPoints.map(
      point => point.y
    );


  const minX =
    Math.min(...xs);

  const maxX =
    Math.max(...xs);

  const minY =
    Math.min(...ys);

  const maxY =
    Math.max(...ys);


  const width =
    maxX - minX;

  const height =
    maxY - minY;


  const close =
    Math.hypot(

      first.x - last.x,

      first.y - last.y

    );


  return (

    close <
      Math.max(
        45,
        Math.min(
          width,
          height
        ) * .35
      )

    &&

    width > 70

    &&

    height > 70

  );

}


/* =========================================================
   QUESTION MARK DETECTION
========================================================= */

function looksLikeQuestionMark(){

  if(
    drawPoints.length < 12
  ){

    return false;

  }


  const xs =
    drawPoints.map(
      point => point.x
    );


  const ys =
    drawPoints.map(
      point => point.y
    );


  return (

    Math.max(...xs) -
    Math.min(...xs) > 20

    &&

    Math.max(...ys) -
    Math.min(...ys) > 50

  );

}


/* =========================================================
   DRAW START
========================================================= */

drawCanvas.addEventListener(

  "pointerdown",

  event => {

    drawing = true;


    drawPoints = [

      getCanvasPoint(
        event
      )

    ];


    try{

      drawCanvas.setPointerCapture(
        event.pointerId
      );

    }catch(error){}

  }

);


/* =========================================================
   DRAW MOVE
========================================================= */

drawCanvas.addEventListener(

  "pointermove",

  event => {

    if(!drawing){

      return;

    }


    drawPoints.push(

      getCanvasPoint(
        event
      )

    );


    /*
      Prevent unlimited points.
    */

    if(
      drawPoints.length > 160
    ){

      drawPoints.shift();

    }


    drawPath();

  }

);


/* =========================================================
   DRAW END
========================================================= */

drawCanvas.addEventListener(

  "pointerup",

  () => {

    if(!drawing){

      return;

    }


    drawing = false;


    /* =====================
       CIRCLE
    ====================== */

    if(looksLikeCircle()){

      clearDrawing();


      input.focus();


      showToast(
        "SUMMONED"
      );


      quasar.animate(

        [

          {
            filter:
              "brightness(1)"
          },

          {
            filter:
              "brightness(2.4)"
          },

          {
            filter:
              "brightness(1)"
          }

        ],

        {

          duration:700,

          easing:"ease-out"

        }

      );

    }


    /* =====================
       QUESTION MARK
    ====================== */

    else if(
      looksLikeQuestionMark()
    ){

      clearDrawing();

      suggestions.classList.add(
        "show"
      );

    }


    /* =====================
       OTHER DRAWING
    ====================== */

    else{

      setTimeout(

        clearDrawing,

        120

      );

    }


    drawPoints = [];

  }

);


/* =========================================================
   DRAW CANCEL
========================================================= */

drawCanvas.addEventListener(

  "pointercancel",

  () => {

    drawing = false;

    drawPoints = [];

    clearDrawing();

  }

);


/* =========================================================
   SUGGESTION BUTTONS
========================================================= */

suggestions
  .querySelectorAll(".s-btn")
  .forEach(button => {

    button.addEventListener(

      "click",

      () => {

        input.value =
          button.textContent;


        suggestions.classList.remove(
          "show"
        );


        input.focus();

      }

    );

  });


/* =========================================================
   CLOSE SUGGESTIONS
========================================================= */

document.addEventListener(

  "pointerdown",

  event => {

    if(

      !suggestions.contains(
        event.target
      )

      &&

      event.target !==
        drawCanvas

    ){

      suggestions.classList.remove(
        "show"
      );

    }

  }

);


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(

  "keydown",

  event => {

    if(event.key === "Escape"){

      suggestions.classList.remove(
        "show"
      );


      input.blur();


      clearDrawing();

    }


    /*
      "/" focuses QUASAR.
    */

    if(

      event.key === "/"

      &&

      document.activeElement !==
        input

    ){

      event.preventDefault();

      input.focus();

    }

  }

);


/* =========================================================
   SEND MESSAGE
========================================================= */

composer.addEventListener(

  "submit",

  event => {

    event.preventDefault();


    const text =
      input.value.trim();


    if(!text){

      return;

    }


    /*
      IMPORTANT:

      This ONLY adds the user's message.

      There is NO fake response.
    */

    addUserMessage(
      text
    );


    input.value = "";


    /*
      Show QUASAR thinking.

      The real backend will eventually
      stop this when its response arrives.
    */

    startThinking();

  }

);


/* =========================================================
   VOICE INPUT
========================================================= */

mic.addEventListener(

  "click",

  () => {

    const Recognition =

      window.SpeechRecognition ||

      window.webkitSpeechRecognition;


    if(!Recognition){

      showToast(
        "VOICE NOT AVAILABLE"
      );

      return;

    }


    const recognition =
      new Recognition();


    recognition.lang =
      "en-IN";


    recognition.interimResults =
      false;


    recognition.onstart =
      () => {

        showToast(
          "LISTENING"
        );

      };


    recognition.onresult =
      event => {

        input.value =
          event
            .results[0][0]
            .transcript;


        input.focus();

      };


    recognition.onerror =
      () => {

        showToast(
          "VOICE ERROR"
        );

      };


    recognition.start();

  }

);


/* =========================================================
   PUBLIC QUASAR BRIDGE

   The REAL AI will use this.
========================================================= */

window.QuasarUI = {

  /*
    Backend → UI
  */

  addAssistantMessage,


  /*
    Backend can control thinking.
  */

  startThinking,

  stopThinking,


  /*
    Backend can change mode.
  */

  setCosmicMode,


  /*
    Clear visible conversation.
  */

  clearMessages(){

    messages = [];

    renderMessages();

  },


  /*
    Useful for backend debugging.
  */

  getState(){

    return {

      cosmicMode,

      thinking,

      messages:
        [...messages]

    };

  }

};


/* =========================================================
   OPTIONAL REAL-AI EVENT BRIDGE

   A future AI module can do:

   window.dispatchEvent(
     new CustomEvent(
       "quasar:ai-response",
       {
         detail:{
           text:"REAL AI RESPONSE"
         }
       }
     )
   );

   Nothing is generated automatically.
========================================================= */

window.addEventListener(

  "quasar:ai-response",

  event => {

    if(

      event.detail &&

      typeof event.detail.text ===
        "string"

    ){

      addAssistantMessage(
        event.detail.text
      );

    }

  }

);


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(

  "resize",

  resizeCanvas

);


window.addEventListener(

  "orientationchange",

  () => {

    setTimeout(

      resizeCanvas,

      250

    );

  }

);


/* =========================================================
   INITIALIZE
========================================================= */

resizeCanvas();

renderMessages();

input.focus();


})();
</script>

</body>
</html>
