<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>QUASAR</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#050608;
  --panel:#0c0e12;
  --panel-light:#11141a;
  --line:rgba(255,255,255,.08);
  --text:#f4f5f7;
  --muted:#777d88;
  --accent:#8b7cff;
}

html,
body{
  width:100%;
  height:100%;
}

body{
  background:#050608;
  color:var(--text);
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  overflow:hidden;
}


/* =========================
   APP
========================= */

.app{
  width:100%;
  height:100vh;
  position:relative;
  overflow:hidden;
}


/* =========================
   BACKGROUND
========================= */

.background{
  position:absolute;
  inset:0;
  pointer-events:none;
  overflow:hidden;
}

.glow{
  position:absolute;
  width:500px;
  height:500px;
  border-radius:50%;
  background:radial-gradient(
    circle,
    rgba(104,91,255,.13) 0%,
    rgba(104,91,255,.05) 30%,
    transparent 70%
  );
  top:-220px;
  left:50%;
  transform:translateX(-50%);
}

.glow-bottom{
  position:absolute;
  width:600px;
  height:350px;
  border-radius:50%;
  background:radial-gradient(
    circle,
    rgba(100,80,255,.045),
    transparent 70%
  );
  bottom:-250px;
  left:50%;
  transform:translateX(-50%);
}


/* =========================
   TOP
========================= */

.top{
  position:absolute;
  top:0;
  left:0;
  right:0;

  height:100px;

  display:flex;
  align-items:center;
  justify-content:center;

  z-index:5;
}


/* LOGO */

.logo{
  width:56px;
  height:56px;

  object-fit:contain;

  filter:
    drop-shadow(0 0 15px rgba(130,110,255,.22));

  opacity:.96;

  transition:
    transform .35s ease,
    filter .35s ease;
}

.logo:hover{
  transform:scale(1.04);

  filter:
    drop-shadow(0 0 25px rgba(130,110,255,.4));
}


/* =========================
   MAIN
========================= */

.main{
  position:relative;

  width:100%;
  height:100%;

  display:flex;
  justify-content:center;

  z-index:2;
}

.center{
  width:min(850px,100%);

  height:100%;

  display:flex;
  flex-direction:column;
  align-items:center;

  padding:
    120px
    20px
    0;
}


/* =========================
   TITLE
========================= */

.title{
  margin-top:35px;

  font-size:34px;
  font-weight:500;

  letter-spacing:7px;

  color:#f2f2f4;

  text-align:center;
}


/* =========================
   SUBTITLE
========================= */

.subtitle{
  margin-top:12px;

  color:#656a74;

  font-size:12px;

  letter-spacing:1.2px;

  text-align:center;
}


/* =========================
   CHAT AREA
========================= */

.chat-area{
  width:100%;

  flex:1;

  min-height:0;

  display:flex;
  flex-direction:column;
  align-items:center;

  padding-top:40px;
}


/* =========================
   WELCOME
========================= */

.welcome{
  width:100%;

  display:flex;
  flex-direction:column;
  align-items:center;

  text-align:center;
}

.welcome-text{
  color:#666c76;

  font-size:13px;

  max-width:430px;

  line-height:1.7;
}


/* =========================
   SUGGESTIONS
========================= */

.suggestions{
  width:min(620px,100%);

  display:grid;

  grid-template-columns:
    repeat(2,1fr);

  gap:10px;

  margin-top:28px;
}

.suggestion{
  border:1px solid var(--line);

  background:
    rgba(255,255,255,.025);

  color:#a8adb6;

  padding:14px 16px;

  border-radius:13px;

  font-size:12px;

  text-align:left;

  cursor:pointer;

  transition:
    background .2s ease,
    border .2s ease,
    transform .2s ease;
}

.suggestion:hover{
  background:
    rgba(255,255,255,.045);

  border-color:
    rgba(139,124,255,.22);

  transform:translateY(-2px);

  color:#d7d9de;
}


/* =========================
   MESSAGES
========================= */

.messages{
  width:100%;

  flex:1;

  overflow-y:auto;

  display:none;

  padding:
    20px
    10px
    30px;
}

.message{
  display:flex;

  margin-bottom:20px;
}

.message.user{
  justify-content:flex-end;
}

.bubble{
  max-width:
    min(680px,82%);

  padding:
    13px
    16px;

  font-size:13px;

  line-height:1.65;

  border-radius:16px;
}

.assistant .bubble{
  background:
    rgba(255,255,255,.035);

  border:
    1px solid var(--line);

  color:#d6d9df;

  border-bottom-left-radius:5px;
}

.user .bubble{
  background:
    #171522;

  border:
    1px solid rgba(139,124,255,.15);

  color:#e9e8f2;

  border-bottom-right-radius:5px;
}


/* =========================
   INPUT SECTION
========================= */

.input-section{
  width:100%;

  display:flex;
  flex-direction:column;
  align-items:center;

  padding:
    0
    0
    42px;
}


/* =========================
   INPUT
========================= */

.input-box{
  width:min(720px,100%);

  min-height:60px;

  display:flex;
  align-items:flex-end;

  gap:8px;

  padding:8px;

  background:
    rgba(13,15,20,.92);

  border:
    1px solid rgba(255,255,255,.09);

  border-radius:19px;

  box-shadow:
    0 20px 60px rgba(0,0,0,.4);

  backdrop-filter:
    blur(18px);

  transition:
    border .25s ease,
    box-shadow .25s ease;
}

.input-box:focus-within{
  border-color:
    rgba(139,124,255,.3);

  box-shadow:
    0 20px 70px rgba(0,0,0,.5),
    0 0 30px rgba(100,80,255,.05);
}

textarea{
  flex:1;

  min-height:42px;
  max-height:120px;

  resize:none;

  border:0;
  outline:0;

  background:transparent;

  color:#f4f5f7;

  font-family:inherit;

  font-size:13px;

  padding:
    11px
    9px;
}

textarea::placeholder{
  color:#5f646e;
}


/* =========================
   BUTTONS
========================= */

.icon-btn,
.send-btn{
  width:42px;
  height:42px;

  flex:none;

  border:0;

  border-radius:13px;

  display:flex;
  align-items:center;
  justify-content:center;

  cursor:pointer;

  transition:
    transform .2s ease,
    background .2s ease,
    color .2s ease;
}

.icon-btn{
  background:
    rgba(255,255,255,.045);

  color:#858b96;
}

.icon-btn:hover{
  background:
    rgba(255,255,255,.08);

  color:#dfe1e6;
}

.send-btn{
  background:
    #8173f4;

  color:white;

  box-shadow:
    0 5px 20px rgba(129,115,244,.18);
}

.send-btn:hover{
  background:#9185ff;

  transform:
    translateY(-1px);
}

.icon-btn svg,
.send-btn svg{
  width:18px;
  height:18px;
}


/* =========================
   FOOTNOTE
========================= */

.disclaimer{
  margin-top:9px;

  color:#474c55;

  font-size:9px;

  letter-spacing:.2px;
}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

  .top{
    height:88px;
  }

  .logo{
    width:48px;
    height:48px;
  }

  .center{
    padding:
      105px
      14px
      0;
  }

  .title{
    margin-top:27px;

    font-size:29px;

    letter-spacing:6px;
  }

  .subtitle{
    font-size:10px;
  }

  .chat-area{
    padding-top:30px;
  }

  .suggestions{
    grid-template-columns:1fr;

    margin-top:22px;
  }

  .suggestion{
    padding:13px;
  }

  .input-section{
    padding-bottom:28px;
  }

  .input-box{
    min-height:58px;
  }

}


/* =========================
   VERY SMALL SCREEN
========================= */

@media(max-height:700px){

  .top{
    height:76px;
  }

  .logo{
    width:43px;
    height:43px;
  }

  .center{
    padding-top:88px;
  }

  .title{
    margin-top:20px;
    font-size:27px;
  }

  .subtitle{
    display:none;
  }

  .chat-area{
    padding-top:20px;
  }

  .suggestions{
    margin-top:18px;
  }

  .input-section{
    padding-bottom:20px;
  }

}
</style>
</head>


<body>

<div class="app">

  <div class="background">
    <div class="glow"></div>
    <div class="glow-bottom"></div>
  </div>


  <!-- TOP CENTER LOGO -->

  <div class="top">

    <img
      class="logo"
      src="https://drive.google.com/uc?export=view&id=1psqfF-1XZcolA1QoZIES3Y-PiH_koliU"
      alt="QUASAR"
    >

  </div>


  <main class="main">

    <div class="center">


      <!-- TITLE -->

      <h1 class="title">
        QUASAR
      </h1>

      <div class="subtitle">
        PERSONAL INTELLIGENCE
      </div>


      <!-- CHAT -->

      <div class="chat-area">


        <!-- WELCOME -->

        <div
          class="welcome"
          id="welcome"
        >

          <p class="welcome-text">
            Your personal intelligence system.
            Ask anything, research anything, or give me something to do.
          </p>


          <div class="suggestions">

            <button
              class="suggestion"
              onclick="useSuggestion('Find 20 cafes near me')"
            >
              Find 20 cafes near me
            </button>

            <button
              class="suggestion"
              onclick="useSuggestion('Research something for me')"
            >
              Research something for me
            </button>

            <button
              class="suggestion"
              onclick="useSuggestion('Help me plan my day')"
            >
              Help me plan my day
            </button>

            <button
              class="suggestion"
              onclick="useSuggestion('Explain something to me')"
            >
              Explain something to me
            </button>

          </div>

        </div>


        <!-- MESSAGES -->

        <div
          class="messages"
          id="messages"
        ></div>


      </div>


      <!-- INPUT -->

      <div class="input-section">

        <div class="input-box">


          <!-- MIC -->

          <button
            class="icon-btn"
            id="micBtn"
            aria-label="Voice input"
          >

            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >

              <rect
                x="9"
                y="3"
                width="6"
                height="11"
                rx="3"
              ></rect>

              <path
                d="M5 11a7 7 0 0 0 14 0"
              ></path>

              <path
                d="M12 18v3"
              ></path>

              <path
                d="M8 21h8"
              ></path>

            </svg>

          </button>


          <textarea
            id="input"
            rows="1"
            placeholder="Ask QUASAR anything..."
          ></textarea>


          <!-- SEND -->

          <button
            class="send-btn"
            id="sendBtn"
            aria-label="Send"
          >

            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >

              <path
                d="M22 2 11 13"
              ></path>

              <path
                d="m22 2-7 20-4-9-9-4Z"
              ></path>

            </svg>

          </button>

        </div>


        <div class="disclaimer">
          QUASAR can make mistakes. Verify important information.
        </div>

      </div>

    </div>

  </main>

</div>


<script>

const input =
  document.getElementById("input");

const sendBtn =
  document.getElementById("sendBtn");

const messages =
  document.getElementById("messages");

const welcome =
  document.getElementById("welcome");


function useSuggestion(text){

  input.value = text;

  input.focus();

}


function addMessage(text,type){

  const message =
    document.createElement("div");

  message.className =
    "message " + type;

  const bubble =
    document.createElement("div");

  bubble.className =
    "bubble";

  bubble.textContent =
    text;

  message.appendChild(bubble);

  messages.appendChild(message);

  messages.scrollTop =
    messages.scrollHeight;

}


function sendMessage(){

  const text =
    input.value.trim();

  if(!text) return;

  welcome.style.display =
    "none";

  messages.style.display =
    "block";

  addMessage(
    text,
    "user"
  );

  input.value = "";

  setTimeout(()=>{

    addMessage(
      "QUASAR is online. The intelligence layer will be connected next.",
      "assistant"
    );

  },500);

}


sendBtn.addEventListener(
  "click",
  sendMessage
);


input.addEventListener(
  "keydown",
  (e)=>{

    if(
      e.key === "Enter" &&
      !e.shiftKey
    ){

      e.preventDefault();

      sendMessage();

    }

  }
);


input.addEventListener(
  "input",
  ()=>{

    input.style.height =
      "auto";

    input.style.height =
      Math.min(
        input.scrollHeight,
        120
      ) + "px";

  }
);


/* VOICE INPUT */

const micBtn =
  document.getElementById("micBtn");


if(
  "webkitSpeechRecognition"
  in window
){

  const recognition =
    new webkitSpeechRecognition();

  recognition.lang =
    "en-IN";

  recognition.continuous =
    false;

  recognition.interimResults =
    false;


  micBtn.addEventListener(
    "click",
    ()=>{

      recognition.start();

    }
  );


  recognition.onresult =
    (event)=>{

      input.value =
        event.results[0][0]
        .transcript;

      input.focus();

    };


}else{

  micBtn.addEventListener(
    "click",
    ()=>{

      alert(
        "Voice input isn't supported in this browser."
      );

    }
  );

}

</script>

</body>
</html>
