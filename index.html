<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>QUASAR</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  width:100%;
  height:100%;
}

body{
  overflow:hidden;
  background:#000;
  color:#fff;
  font-family:
    Inter,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

/* =========================================================
   MAIN APP
========================================================= */

#app{
  position:relative;
  width:100%;
  height:100%;
  min-height:100dvh;
  overflow:hidden;
  background:
    radial-gradient(
      circle at 50% 48%,
      rgba(255,255,255,.035),
      transparent 24%
    ),
    #000;
}

/* =========================================================
   HEADER
========================================================= */

header{
  position:absolute;
  top:0;
  left:0;
  right:0;
  z-index:20;

  height:72px;

  display:flex;
  align-items:center;
  justify-content:center;

  pointer-events:none;
}

.logo{
  position:relative;

  font-size:14px;
  font-weight:700;
  letter-spacing:7px;

  color:rgba(255,255,255,.92);

  text-shadow:
    0 0 12px rgba(255,255,255,.16);

  user-select:none;
}

/* =========================================================
   COSMIC FIELD
========================================================= */

.cosmic-field{
  position:absolute;
  inset:0;
  overflow:hidden;
  pointer-events:none;
}

.star{
  position:absolute;

  width:1px;
  height:1px;

  border-radius:50%;
  background:#fff;

  opacity:.4;

  animation:
    starPulse 4s ease-in-out infinite;
}

.star:nth-child(1){left:8%;top:14%;animation-delay:.2s}
.star:nth-child(2){left:17%;top:28%;animation-delay:1.2s}
.star:nth-child(3){left:28%;top:11%;animation-delay:2s}
.star:nth-child(4){left:38%;top:23%;animation-delay:.8s}
.star:nth-child(5){left:51%;top:9%;animation-delay:1.7s}
.star:nth-child(6){left:63%;top:18%;animation-delay:.4s}
.star:nth-child(7){left:77%;top:12%;animation-delay:2.4s}
.star:nth-child(8){left:89%;top:26%;animation-delay:1s}
.star:nth-child(9){left:12%;top:58%;animation-delay:1.9s}
.star:nth-child(10){left:22%;top:72%;animation-delay:.7s}
.star:nth-child(11){left:35%;top:84%;animation-delay:2.1s}
.star:nth-child(12){left:48%;top:70%;animation-delay:1.1s}
.star:nth-child(13){left:66%;top:82%;animation-delay:2.7s}
.star:nth-child(14){left:79%;top:68%;animation-delay:.9s}
.star:nth-child(15){left:92%;top:79%;animation-delay:1.8s}
.star:nth-child(16){left:5%;top:43%;animation-delay:2.5s}
.star:nth-child(17){left:96%;top:48%;animation-delay:.3s}
.star:nth-child(18){left:44%;top:4%;animation-delay:1.4s}
.star:nth-child(19){left:71%;top:42%;animation-delay:2.2s}
.star:nth-child(20){left:29%;top:47%;animation-delay:.6s}

@keyframes starPulse{
  0%,
  100%{
    opacity:.18;
    transform:scale(.8);
  }

  50%{
    opacity:.75;
    transform:scale(1.5);
  }
}

/* =========================================================
   QUASAR / BLACK HOLE
========================================================= */

#quasar{
  position:absolute;

  left:50%;
  top:46%;

  width:340px;
  height:340px;

  transform:translate(-50%,-50%);

  cursor:pointer;

  user-select:none;

  touch-action:none;

  transition:
    transform .7s cubic-bezier(.2,.8,.2,1),
    filter .7s ease;
}

#quasar:hover{
  transform:
    translate(-50%,-50%)
    scale(1.025);
}

/* outer glow */

.quasar-glow{
  position:absolute;
  inset:-90px;

  border-radius:50%;

  background:
    radial-gradient(
      circle,
      rgba(255,255,255,.09) 0%,
      rgba(255,255,255,.035) 25%,
      transparent 67%
    );

  filter:blur(18px);

  opacity:.65;
}

/* rays */

.rays{
  position:absolute;
  inset:-65px;

  border-radius:50%;

  background:
    conic-gradient(
      from 0deg,
      transparent 0deg,
      rgba(255,255,255,.025) 7deg,
      transparent 16deg,
      rgba(255,255,255,.035) 24deg,
      transparent 36deg,
      rgba(255,255,255,.025) 47deg,
      transparent 62deg,
      rgba(255,255,255,.035) 77deg,
      transparent 94deg,
      rgba(255,255,255,.025) 111deg,
      transparent 126deg,
      rgba(255,255,255,.035) 143deg,
      transparent 160deg,
      rgba(255,255,255,.025) 178deg,
      transparent 193deg,
      rgba(255,255,255,.035) 211deg,
      transparent 228deg,
      rgba(255,255,255,.025) 245deg,
      transparent 260deg,
      rgba(255,255,255,.035) 278deg,
      transparent 296deg,
      rgba(255,255,255,.025) 313deg,
      transparent 330deg,
      rgba(255,255,255,.035) 347deg,
      transparent 360deg
    );

  filter:blur(8px);

  animation:
    raysRotate 24s linear infinite;
}

@keyframes raysRotate{
  from{
    transform:rotate(0deg);
  }

  to{
    transform:rotate(360deg);
  }
}

/* accretion disk */

.accretion{
  position:absolute;

  left:50%;
  top:50%;

  width:300px;
  height:108px;

  transform:
    translate(-50%,-50%)
    rotate(-13deg);

  border-radius:50%;

  background:
    radial-gradient(
      ellipse at center,
      transparent 0 22%,
      rgba(255,255,255,.10) 23%,
      rgba(255,255,255,.22) 27%,
      rgba(255,255,255,.07) 38%,
      transparent 59%
    );

  filter:
    blur(1.5px)
    drop-shadow(0 0 14px rgba(255,255,255,.14));

  animation:
    diskPulse 5s ease-in-out infinite;
}

@keyframes diskPulse{
  0%,
  100%{
    opacity:.72;
    transform:
      translate(-50%,-50%)
      rotate(-13deg)
      scaleX(1);
  }

  50%{
    opacity:1;
    transform:
      translate(-50%,-50%)
      rotate(-13deg)
      scaleX(1.06);
  }
}

/* second disk */

.accretion::before{
  content:"";

  position:absolute;
  left:50%;
  top:50%;

  width:250px;
  height:70px;

  transform:
    translate(-50%,-50%)
    rotate(3deg);

  border-radius:50%;

  border-top:
    1px solid rgba(255,255,255,.28);

  border-bottom:
    1px solid rgba(255,255,255,.08);

  filter:blur(2px);
}

/* gravitational rings */

.ring{
  position:absolute;

  left:50%;
  top:50%;

  border-radius:50%;

  border:1px solid rgba(255,255,255,.09);

  transform:
    translate(-50%,-50%)
    rotate(-12deg);

  pointer-events:none;
}

.ring.one{
  width:285px;
  height:105px;
}

.ring.two{
  width:325px;
  height:125px;

  border-color:
    rgba(255,255,255,.055);
}

.ring.three{
  width:375px;
  height:145px;

  border-color:
    rgba(255,255,255,.035);
}

/* black hole core */

.core{
  position:absolute;

  left:50%;
  top:50%;

  width:128px;
  height:128px;

  transform:translate(-50%,-50%);

  border-radius:50%;

  background:#000;

  box-shadow:
    0 0 0 1px rgba(255,255,255,.06),
    0 0 25px rgba(0,0,0,.9),
    0 0 70px rgba(0,0,0,1);

  z-index:5;
}

/* event horizon */

.horizon{
  position:absolute;

  left:50%;
  top:50%;

  width:154px;
  height:154px;

  transform:translate(-50%,-50%);

  border-radius:50%;

  border:
    1px solid rgba(255,255,255,.12);

  box-shadow:
    0 0 20px rgba(255,255,255,.06),
    inset 0 0 20px rgba(255,255,255,.04);

  z-index:4;

  animation:
    horizonPulse 4s ease-in-out infinite;
}

@keyframes horizonPulse{
  0%,
  100%{
    opacity:.55;
    transform:
      translate(-50%,-50%)
      scale(1);
  }

  50%{
    opacity:.9;
    transform:
      translate(-50%,-50%)
      scale(1.025);
  }
}

/* inner ring */

.inner-ring{
  position:absolute;

  left:50%;
  top:50%;

  width:190px;
  height:68px;

  transform:
    translate(-50%,-50%)
    rotate(-13deg);

  border-radius:50%;

  border:
    1px solid rgba(255,255,255,.14);

  filter:blur(.5px);

  z-index:3;
}

/* central light */

.core-light{
  position:absolute;

  left:50%;
  top:50%;

  width:4px;
  height:4px;

  transform:translate(-50%,-50%);

  border-radius:50%;

  background:#fff;

  box-shadow:
    0 0 10px rgba(255,255,255,.8),
    0 0 25px rgba(255,255,255,.25);

  opacity:.18;
}

/* =========================================================
   JET / BEAM
========================================================= */

.beam{
  position:absolute;

  left:50%;
  top:-105px;

  width:2px;
  height:160px;

  transform:
    translateX(-50%)
    rotate(2deg);

  background:
    linear-gradient(
      to top,
      rgba(255,255,255,.12),
      rgba(255,255,255,.02),
      transparent
    );

  filter:blur(1px);

  opacity:.6;

  z-index:1;
}

.beam.bottom{
  top:auto;
  bottom:-105px;

  transform:
    translateX(-50%)
    rotate(182deg);
}

/* =========================================================
   THINKING STATE
========================================================= */

#quasar.thinking .quasar-glow{
  animation:
    thinkingGlow 1.5s ease-in-out infinite;
}

#quasar.thinking .accretion{
  animation-duration:2.2s;
}

#quasar.thinking .core{
  box-shadow:
    0 0 0 1px rgba(255,255,255,.1),
    0 0 30px rgba(255,255,255,.06),
    0 0 90px rgba(255,255,255,.04);
}

@keyframes thinkingGlow{
  0%,
  100%{
    opacity:.45;
    transform:scale(.95);
  }

  50%{
    opacity:.95;
    transform:scale(1.08);
  }
}

/* =========================================================
   CONVERSATION
========================================================= */

#conversation{
  position:absolute;

  left:50%;
  top:calc(50% + 205px);

  width:min(760px,calc(100% - 36px));

  transform:translateX(-50%);

  z-index:12;

  display:flex;
  flex-direction:column;
  gap:10px;

  max-height:170px;

  overflow-y:auto;

  padding:
    4px
    8px
    12px;

  scrollbar-width:none;

  pointer-events:auto;
}

#conversation::-webkit-scrollbar{
  display:none;
}

.message{
  width:100%;

  display:flex;
}

.message.user{
  justify-content:flex-end;
}

.message.assistant{
  justify-content:flex-start;
}

.message-bubble{
  max-width:min(78%,560px);

  padding:
    11px
    15px;

  border-radius:16px;

  font-size:14px;
  line-height:1.55;

  letter-spacing:.1px;

  animation:
    messageIn .35s ease both;
}

.message.user .message-bubble{
  color:#fff;

  background:
    rgba(255,255,255,.08);

  border:
    1px solid rgba(255,255,255,.08);
}

.message.assistant .message-bubble{
  color:rgba(255,255,255,.82);

  background:
    rgba(255,255,255,.035);

  border:
    1px solid rgba(255,255,255,.045);
}

@keyframes messageIn{
  from{
    opacity:0;
    transform:translateY(8px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }
}

/* =========================================================
   COMPOSER
========================================================= */

#composer{
  position:absolute;

  left:50%;
  bottom:24px;

  width:min(720px,calc(100% - 28px));

  transform:translateX(-50%);

  z-index:30;

  display:flex;
  align-items:center;
  gap:8px;

  padding:7px;

  border-radius:20px;

  background:
    rgba(255,255,255,.055);

  border:
    1px solid rgba(255,255,255,.09);

  box-shadow:
    0 15px 50px rgba(0,0,0,.45),
    inset 0 1px 0 rgba(255,255,255,.025);

  backdrop-filter:
    blur(22px);

  -webkit-backdrop-filter:
    blur(22px);
}

#input{
  flex:1;

  min-width:0;

  height:46px;

  border:0;
  outline:0;

  background:transparent;

  color:#fff;

  font-size:15px;

  padding:
    0 10px;
}

#input::placeholder{
  color:rgba(255,255,255,.32);
}

.tool-button,
#send{
  flex:
    0
    0
    42px;

  width:42px;
  height:42px;

  display:grid;
  place-items:center;

  border:0;

  border-radius:14px;

  color:rgba(255,255,255,.7);

  background:
    rgba(255,255,255,.045);

  cursor:pointer;

  transition:
    background .2s ease,
    color .2s ease,
    transform .2s ease;
}

.tool-button:hover,
#send:hover{
  color:#fff;

  background:
    rgba(255,255,255,.1);

  transform:translateY(-1px);
}

#send{
  background:#fff;
  color:#000;
}

#send:hover{
  background:#eee;
  color:#000;
}

/* =========================================================
   MIC
========================================================= */

#mic svg,
#send svg{
  width:18px;
  height:18px;
}

#mic.listening{
  color:#fff;

  background:
    rgba(255,255,255,.13);

  box-shadow:
    0 0 0 5px rgba(255,255,255,.025);
}

/* =========================================================
   SUGGESTIONS
========================================================= */

#suggestions{
  position:absolute;

  left:50%;
  bottom:84px;

  width:min(720px,calc(100% - 28px));

  transform:
    translateX(-50%)
    translateY(10px);

  z-index:29;

  display:flex;
  flex-wrap:wrap;
  gap:8px;

  opacity:0;
  visibility:hidden;

  pointer-events:none;

  transition:
    opacity .2s ease,
    transform .2s ease,
    visibility .2s ease;
}

#suggestions.open{
  opacity:1;
  visibility:visible;

  pointer-events:auto;

  transform:
    translateX(-50%)
    translateY(0);
}

.suggestion{
  padding:
    9px
    13px;

  border-radius:999px;

  border:
    1px solid rgba(255,255,255,.08);

  background:
    rgba(255,255,255,.045);

  color:
    rgba(255,255,255,.68);

  font-size:12px;

  cursor:pointer;

  transition:
    background .2s ease,
    color .2s ease,
    transform .2s ease;
}

.suggestion:hover{
  color:#fff;

  background:
    rgba(255,255,255,.09);

  transform:translateY(-1px);
}

/* =========================================================
   DRAW CANVAS
========================================================= */

#drawCanvas{
  position:absolute;

  inset:0;

  z-index:40;

  width:100%;
  height:100%;

  pointer-events:none;

  opacity:0;

  transition:opacity .25s ease;
}

#drawCanvas.active{
  pointer-events:auto;
  opacity:1;
}

/* =========================================================
   COSMIC MODE
========================================================= */

body.cosmic-mode #app{
  background:
    radial-gradient(
      circle at 50% 46%,
      rgba(255,255,255,.055),
      transparent 30%
    ),
    #000;
}

body.cosmic-mode .star{
  animation-duration:2s;
}

body.cosmic-mode #quasar{
  filter:
    brightness(1.15)
    contrast(1.08);
}

body.cosmic-mode .quasar-glow{
  opacity:.95;
}

body.cosmic-mode .accretion{
  filter:
    blur(1px)
    drop-shadow(0 0 22px rgba(255,255,255,.2));
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media (max-width:700px){

  header{
    height:62px;
  }

  .logo{
    font-size:12px;
    letter-spacing:6px;
  }

  #quasar{
    width:280px;
    height:280px;

    top:43%;
  }

  .quasar-glow{
    inset:-65px;
  }

  .rays{
    inset:-48px;
  }

  .accretion{
    width:245px;
    height:88px;
  }

  .ring.one{
    width:235px;
    height:88px;
  }

  .ring.two{
    width:270px;
    height:105px;
  }

  .ring.three{
    width:310px;
    height:120px;
  }

  .core{
    width:108px;
    height:108px;
  }

  .horizon{
    width:130px;
    height:130px;
  }

  .inner-ring{
    width:160px;
    height:58px;
  }

  #conversation{
    top:calc(43% + 175px);

    max-height:145px;

    width:
      calc(100% - 24px);
  }

  .message-bubble{
    max-width:86%;
    font-size:13px;
  }

  #composer{
    bottom:14px;

    width:
      calc(100% - 18px);

    border-radius:18px;
  }

  #input{
    font-size:14px;
  }

  .tool-button,
  #send{
    flex-basis:40px;

    width:40px;
    height:40px;

    border-radius:13px;
  }

  #suggestions{
    bottom:74px;

    width:
      calc(100% - 18px);
  }
}

@media (max-height:650px){

  #quasar{
    top:40%;
  }

  #conversation{
    top:calc(40% + 155px);
    max-height:110px;
  }

  #composer{
    bottom:9px;
  }

  #suggestions{
    bottom:65px;
  }
}

/* =========================================================
   ACCESSIBILITY
========================================================= */

button,
input{
  font-family:inherit;
}

button:focus-visible,
input:focus-visible{
  outline:
    1px solid
    rgba(255,255,255,.35);

  outline-offset:2px;
}
</style>
</head>

<body>

<div id="app">

  <div class="cosmic-field" aria-hidden="true">
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
  </div>

  <header>
    <div class="logo">QUASAR</div>
  </header>

  <main>

    <div
      id="quasar"
      aria-label="Quasar"
      role="button"
      tabindex="0"
    >

      <div class="quasar-glow"></div>

      <div class="rays"></div>

      <div class="beam"></div>
      <div class="beam bottom"></div>

      <div class="ring three"></div>
      <div class="ring two"></div>
      <div class="ring one"></div>

      <div class="accretion"></div>

      <div class="inner-ring"></div>

      <div class="horizon"></div>

      <div class="core">
        <div class="core-light"></div>
      </div>

    </div>

    <div id="conversation"></div>

  </main>

  <canvas id="drawCanvas"></canvas>

  <div id="suggestions">

    <button
      class="suggestion"
      type="button"
      data-message="What can you do?"
    >
      What can you do?
    </button>

    <button
      class="suggestion"
      type="button"
      data-message="Search the web"
    >
      Search the web
    </button>

    <button
      class="suggestion"
      type="button"
      data-message="Remember this"
    >
      Remember this
    </button>

  </div>

  <form id="composer">

    <input
      id="input"
      type="text"
      autocomplete="off"
      placeholder="Ask Quasar anything..."
      aria-label="Message Quasar"
    />

    <button
      id="mic"
      class="tool-button"
      type="button"
      aria-label="Voice input"
    >
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <rect
          x="9"
          y="3"
          width="6"
          height="11"
          rx="3"
        ></rect>

        <path d="M5 11a7 7 0 0 0 14 0"></path>
        <path d="M12 18v3"></path>
        <path d="M8 21h8"></path>
      </svg>
    </button>

    <button
      id="send"
      type="submit"
      aria-label="Send message"
    >
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M22 2 11 13"></path>
        <path d="m22 2-7 20-4-9-9-4Z"></path>
      </svg>
    </button>

  </form>

</div>
<script>
(function(){

  "use strict";

  /* =======================================================
     QUASAR STATE
  ======================================================= */

  const state = {
    messages: [],
    cosmicMode: false,
    thinking: false,
    longPressTimer: null,
    toastTimer: null,
    drawing: false,
    drawPoints: []
  };

  /* =======================================================
     ELEMENTS
  ======================================================= */

  const quasar =
    document.getElementById("quasar");

  const conversation =
    document.getElementById("conversation");

  const input =
    document.getElementById("input");

  const mic =
    document.getElementById("mic");

  const suggestions =
    document.getElementById("suggestions");

  const drawCanvas =
    document.getElementById("drawCanvas");

  const ctx =
    drawCanvas.getContext("2d");

  /* =======================================================
     TOAST
  ======================================================= */

  function showToast(message){

    let toast =
      document.getElementById("quasarToast");

    if(!toast){

      toast =
        document.createElement("div");

      toast.id =
        "quasarToast";

      toast.style.position =
        "fixed";

      toast.style.left =
        "50%";

      toast.style.top =
        "88px";

      toast.style.transform =
        "translateX(-50%)";

      toast.style.zIndex =
        "200";

      toast.style.padding =
        "9px 14px";

      toast.style.borderRadius =
        "999px";

      toast.style.background =
        "rgba(255,255,255,.08)";

      toast.style.border =
        "1px solid rgba(255,255,255,.09)";

      toast.style.color =
        "rgba(255,255,255,.8)";

      toast.style.fontSize =
        "12px";

      toast.style.backdropFilter =
        "blur(15px)";

      toast.style.webkitBackdropFilter =
        "blur(15px)";

      toast.style.pointerEvents =
        "none";

      toast.style.opacity =
        "0";

      toast.style.transition =
        "opacity .2s ease";

      document.body.appendChild(toast);
    }

    toast.textContent =
      message;

    clearTimeout(
      state.toastTimer
    );

    requestAnimationFrame(() => {
      toast.style.opacity = "1";
    });

    state.toastTimer =
      setTimeout(() => {
        toast.style.opacity = "0";
      }, 1800);
  }

  /* =======================================================
     CANVAS
  ======================================================= */

  function resizeCanvas(){

    const ratio =
      window.devicePixelRatio || 1;

    drawCanvas.width =
      window.innerWidth * ratio;

    drawCanvas.height =
      window.innerHeight * ratio;

    drawCanvas.style.width =
      window.innerWidth + "px";

    drawCanvas.style.height =
      window.innerHeight + "px";

    ctx.setTransform(
      ratio,
      0,
      0,
      ratio,
      0,
      0
    );
  }

  /* =======================================================
     MESSAGE RENDERING
  ======================================================= */

  function renderMessages(){

    conversation.innerHTML = "";

    state.messages.forEach(message => {

      const row =
        document.createElement("div");

      row.className =
        "message " +
        (message.role === "user"
          ? "user"
          : "assistant");

      const bubble =
        document.createElement("div");

      bubble.className =
        "message-bubble";

      bubble.textContent =
        message.content;

      row.appendChild(
        bubble
      );

      conversation.appendChild(
        row
      );
    });

    conversation.scrollTop =
      conversation.scrollHeight;
  }

  function addUserMessage(text){

    if(
      !text ||
      typeof text !== "string" ||
      !text.trim()
    ){
      return;
    }

    const cleanText =
      text.trim();

    state.messages.push({
      role: "user",
      content: cleanText
    });

    renderMessages();

    window.dispatchEvent(
      new CustomEvent(
        "quasar:message",
        {
          detail:{
            message:cleanText
          }
        }
      )
    );
  }

  function addAssistantMessage(text){

    if(
      text === undefined ||
      text === null
    ){
      return;
    }

    stopThinking();

    state.messages.push({
      role:"assistant",
      content:String(text)
    });

    renderMessages();
  }

  /* =======================================================
     THINKING
  ======================================================= */

  function startThinking(){

    state.thinking =
      true;

    quasar.classList.add(
      "thinking"
    );
  }

  function stopThinking(){

    state.thinking =
      false;

    quasar.classList.remove(
      "thinking"
    );
  }

  /* =======================================================
     COSMIC MODE
  ======================================================= */

  function setCosmicMode(enabled){

    state.cosmicMode =
      Boolean(enabled);

    document.body.classList.toggle(
      "cosmic-mode",
      state.cosmicMode
    );
  }

  /* =======================================================
     QUASAR INTERACTION
  ======================================================= */

  function openSuggestions(){

    suggestions.classList.add(
      "open"
    );
  }

  function closeSuggestions(){

    suggestions.classList.remove(
      "open"
    );
  }

  quasar.addEventListener(
    "click",
    () => {

      if(state.thinking){
        return;
      }

      openSuggestions();
    }
  );

  quasar.addEventListener(
    "pointerdown",
    () => {

      clearTimeout(
        state.longPressTimer
      );

      state.longPressTimer =
        setTimeout(() => {

          setCosmicMode(
            !state.cosmicMode
          );

          showToast(
            state.cosmicMode
              ? "Cosmic mode enabled"
              : "Cosmic mode disabled"
          );

        }, 650);
    }
  );

  quasar.addEventListener(
    "pointerup",
    () => {

      clearTimeout(
        state.longPressTimer
      );
    }
  );

  quasar.addEventListener(
    "pointercancel",
    () => {

      clearTimeout(
        state.longPressTimer
      );
    }
  );

  quasar.addEventListener(
    "keydown",
    event => {

      if(
        event.key === "Enter" ||
        event.key === " "
      ){

        event.preventDefault();

        openSuggestions();
      }
    }
  );

  /* =======================================================
     DRAW TO SUMMON
  ======================================================= */

  function getPointerPosition(event){

    const rect =
      drawCanvas.getBoundingClientRect();

    return {
      x:event.clientX - rect.left,
      y:event.clientY - rect.top
    };
  }

  function startDrawing(event){

    if(
      event.pointerType === "mouse" &&
      event.button !== 0
    ){
      return;
    }

    state.drawing =
      true;

    state.drawPoints =
      [];

    drawCanvas.classList.add(
      "active"
    );

    const point =
      getPointerPosition(event);

    state.drawPoints.push(
      point
    );

    ctx.clearRect(
      0,
      0,
      window.innerWidth,
      window.innerHeight
    );

    ctx.beginPath();

    ctx.moveTo(
      point.x,
      point.y
    );

    ctx.lineWidth =
      2;

    ctx.lineCap =
      "round";

    ctx.lineJoin =
      "round";

    ctx.strokeStyle =
      "rgba(255,255,255,.75)";

    ctx.shadowColor =
      "rgba(255,255,255,.35)";

    ctx.shadowBlur =
      10;

    drawCanvas.setPointerCapture(
      event.pointerId
    );
  }

  function draw(event){

    if(!state.drawing){
      return;
    }

    const point =
      getPointerPosition(event);

    state.drawPoints.push(
      point
    );

    ctx.lineTo(
      point.x,
      point.y
    );

    ctx.stroke();

    ctx.beginPath();

    ctx.moveTo(
      point.x,
      point.y
    );
  }

  function finishDrawing(){

    if(!state.drawing){
      return;
    }

    state.drawing =
      false;

    const points =
      state.drawPoints;

    drawCanvas.classList.remove(
      "active"
    );

    ctx.clearRect(
      0,
      0,
      window.innerWidth,
      window.innerHeight
    );

    if(points.length < 8){

      state.drawPoints = [];

      return;
    }

    const first =
      points[0];

    const last =
      points[points.length - 1];

    const dx =
      first.x - last.x;

    const dy =
      first.y - last.y;

    const distance =
      Math.sqrt(
        dx * dx +
        dy * dy
      );

    let minX = Infinity;
    let maxX = -Infinity;
    let minY = Infinity;
    let maxY = -Infinity;

    points.forEach(point => {

      minX =
        Math.min(
          minX,
          point.x
        );

      maxX =
        Math.max(
          maxX,
          point.x
        );

      minY =
        Math.min(
          minY,
          point.y
        );

      maxY =
        Math.max(
          maxY,
          point.y
        );
    });

    const width =
      maxX - minX;

    const height =
      maxY - minY;

    const closedShape =
      distance <
      Math.max(
        35,
        Math.min(width,height) * .35
      );

    const looksLikeQuestion =
      !closedShape &&
      height > width * .7;

    if(closedShape){

      input.value =
        "What is inside the quasar?";

      input.focus();

      showToast(
        "Question summoned"
      );

    }else if(looksLikeQuestion){

      input.value =
        "Tell me something interesting.";

      input.focus();

      showToast(
        "Question summoned"
      );

    }else{

      showToast(
        "Draw a circle or question mark"
      );
    }

    state.drawPoints = [];
  }

  drawCanvas.addEventListener(
    "pointerdown",
    startDrawing
  );

  drawCanvas.addEventListener(
    "pointermove",
    draw
  );

  drawCanvas.addEventListener(
    "pointerup",
    finishDrawing
  );

  drawCanvas.addEventListener(
    "pointercancel",
    finishDrawing
  );

  /* =======================================================
     SUGGESTIONS
  ======================================================= */

  document
    .querySelectorAll(".suggestion")
    .forEach(button => {

      button.addEventListener(
        "click",
        () => {

          const message =
            button.dataset.message;

          closeSuggestions();

          if(!message){
            return;
          }

          input.value =
            message;

          input.focus();
        }
      );
    });

  /* =======================================================
     CLOSE SUGGESTIONS
  ======================================================= */

  document.addEventListener(
    "pointerdown",
    event => {

      if(
        !suggestions.contains(event.target) &&
        !quasar.contains(event.target)
      ){

        closeSuggestions();
      }
    }
  );

  /* =======================================================
     KEYBOARD
  ======================================================= */

  input.addEventListener(
    "keydown",
    event => {

      if(
        event.key === "Escape"
      ){

        closeSuggestions();

        input.blur();
      }
    }
  );

  /* =======================================================
     VOICE INPUT
  ======================================================= */

  let recognition = null;

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if(SpeechRecognition){

    recognition =
      new SpeechRecognition();

    recognition.continuous =
      false;

    recognition.interimResults =
      false;

    recognition.lang =
      "en-IN";

    recognition.onstart =
      () => {

        mic.classList.add(
          "listening"
        );

        showToast(
          "Listening..."
        );
      };

    recognition.onresult =
      event => {

        const transcript =
          event.results[0][0].transcript;

        input.value =
          transcript;

        input.focus();
      };

    recognition.onerror =
      event => {

        console.error(
          "Speech recognition error:",
          event.error
        );

        showToast(
          "Voice input unavailable"
        );
      };

    recognition.onend =
      () => {

        mic.classList.remove(
          "listening"
        );
      };

    mic.addEventListener(
      "click",
      () => {

        try{

          recognition.start();

        }catch(error){

          console.error(error);
        }
      }
    );

  }else{

    mic.addEventListener(
      "click",
      () => {

        showToast(
          "Voice input isn't supported here"
        );
      }
    );
  }

  /* =======================================================
     CLEAR MESSAGES
  ======================================================= */

  function clearMessages(){

    state.messages = [];

    renderMessages();

    stopThinking();
  }

  /* =======================================================
     PUBLIC QUASAR UI
  ======================================================= */

  window.QuasarUI = {

    addUserMessage,

    addAssistantMessage,

    startThinking,

    stopThinking,

    setCosmicMode,

    clearMessages,

    getState(){

      return {
        messages:[
          ...state.messages
        ],

        cosmicMode:
          state.cosmicMode,

        thinking:
          state.thinking
      };
    }

  };

  /* =======================================================
     AI RESPONSE EVENT
  ======================================================= */

  window.addEventListener(
    "quasar:ai-response",
    event => {

      const response =
        event.detail?.response;

      if(
        response !== undefined &&
        response !== null
      ){

        addAssistantMessage(
          response
        );
      }
    }
  );

  /* =======================================================
     RESIZE
  ======================================================= */

  window.addEventListener(
    "resize",
    resizeCanvas
  );

  resizeCanvas();

})();
</script>
<script>
(function(){

  "use strict";

  const composer =
    document.getElementById("composer");

  const input =
    document.getElementById("input");

  /* =======================================================
     SEND MESSAGE TO QUASAR AI
  ======================================================= */

  async function sendToQuasar(message){

    try{

      const response =
        await fetch("/api/chat", {
          method:"POST",

          headers:{
            "Content-Type":"application/json"
          },

          body:JSON.stringify({
            message:message
          })
        });

      let data;

      try{
        data = await response.json();
      }catch(error){
        throw new Error(
          "Invalid response from server"
        );
      }

      if(!response.ok){

        throw new Error(
          data.error ||
          "Quasar AI request failed"
        );
      }

      if(
        !data.reply ||
        typeof data.reply !== "string"
      ){

        throw new Error(
          "Quasar returned an empty response"
        );
      }

      window.QuasarUI.addAssistantMessage(
        data.reply
      );

    }catch(error){

      console.error(
        "Quasar AI error:",
        error
      );

      window.QuasarUI.stopThinking();

      window.QuasarUI.addAssistantMessage(
        "I couldn't reach my AI core right now. Please try again."
      );
    }
  }

  /* =======================================================
     COMPOSER
  ======================================================= */

  composer.addEventListener(
    "submit",
    event => {

      event.preventDefault();

      const message =
        input.value.trim();

      if(!message){
        return;
      }

      /*
        Add the user's message to the
        conversation.
      */

      window.QuasarUI.addUserMessage(
        message
      );

      /*
        Clear the input immediately.
      */

      input.value = "";

      /*
        Start the Quasar thinking animation.
      */

      window.QuasarUI.startThinking();

      /*
        Send the message to:
        
        /api/chat
              ↓
        OpenAI API
              ↓
        Quasar response
      */

      sendToQuasar(
        message
      );
    }
  );

})();
</script>
